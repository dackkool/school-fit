<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧跑圈統籌主機 | Main Hub</title>
    <!-- face-api.js 深度學習人臉辨識庫 -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 15px; background-color: #e3f2fd; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 900px; background-color: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 20px; }
        h1 { color: #1565c0; font-size: 1.5rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 15px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 0.95rem; font-weight: bold; color: #888; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #1565c0; border-bottom: 3.5px solid #1565c0; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .status-card { background: #f5f5f5; border: 2px solid #ddd; border-radius: 12px; padding: 10px; text-align: center; }
        .status-card.online { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .status-title { font-size: 0.75rem; font-weight: bold; }
        .status-indicator { font-size: 0.9rem; margin-top: 4px; font-weight: bold; }

        .qr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 10px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .qr-box { background: #fafafa; border: 1.5px dashed #1565c0; border-radius: 12px; padding: 10px; text-align: center; }
        .qr-box img { width: 120px; height: 120px; margin: 5px auto; display: block; }

        #live-log { background: #fafafa; border: 1px solid #ddd; border-radius: 10px; height: 220px; overflow-y: auto; padding: 10px; font-size: 0.9rem; margin-bottom: 10px; }
        .log-item { padding: 6px 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        .input-group { margin-bottom: 10px; }
        .input-group label { font-size: 0.85rem; color: #444; font-weight: bold; display: block; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 8px 10px; font-size: 0.95rem; border-radius: 8px; border: 1.5px solid #ccc; }

        button.btn-primary { width: 100%; padding: 10px; font-size: 1rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #1565c0; margin-top: 5px; }
        button.btn-primary:hover { opacity: 0.9; }

        .camera-box { position: relative; width: 100%; max-width: 320px; height: 240px; background: #000; margin: 0 auto 10px auto; border-radius: 12px; overflow: hidden; }
        .camera-box video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>校園智慧跑圈統籌主機 (Main Hub)</h1>
    <div class="subtitle">多站順序過點驗證・圈速精準計時・Supabase 成績上傳</div>

    <div class="status-grid" id="status-grid-container"></div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('monitor')">⚡ 即時成績統籌</button>
        <button class="tab-btn" onclick="switchTab('qr')">📱 生成分機 QR (2-8)</button>
        <button class="tab-btn" onclick="switchTab('students')">👤 人臉樣貌登記</button>
    </div>

    <!-- TAB 1: 即時成績統籌 -->
    <div id="tab-monitor" class="tab-content active">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
            <div style="flex: 1;">
                <label style="font-size: 0.85rem; font-weight: bold;">當前測驗學生學號：</label>
                <input type="text" id="active-student-id" placeholder="載入中..." style="padding: 6px; width: 100%; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <button class="btn-primary" onclick="resetActiveStudent()" style="padding: 8px 16px; margin-top: 18px;">重新計時</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <strong>📡 順序過點與各圈圈速日誌：</strong>
            <span id="live-lap-counter" style="color: #1565c0; font-weight: bold; font-size: 1.1rem;">完成圈數: 0 圈</span>
        </div>
        <div id="live-log">
            <div style="text-align: center; color: #888; padding: 20px;">請由 CP1 出發，依序通過所有檢查點...</div>
        </div>
        <button class="btn-primary" onclick="uploadLapScores()" style="background-color: #2e7d32;">💾 上傳所有圈速成績至 Supabase</button>
    </div>

    <!-- TAB 2: 生成分機 QR Code -->
    <div id="tab-qr" class="tab-content" style="display: none;">
        <div class="input-group">
            <label>選擇總分站數量 (2 至 8 個)：</label>
            <select id="cp-count-select" onchange="generateQRCodes(); updateStatusGrid();">
                <option value="2">2 個檢查點 (CP1, CP2)</option>
                <option value="3">3 個檢查點 (CP1, CP2, CP3)</option>
                <option value="4" selected>4 個檢查點 (CP1 ~ CP4)</option>
                <option value="5">5 個檢查點 (CP1 ~ CP5)</option>
                <option value="6">6 個檢查點 (CP1 ~ CP6)</option>
                <option value="7">7 個檢查點 (CP1 ~ CP7)</option>
                <option value="8">8 個檢查點 (CP1 ~ CP8)</option>
            </select>
        </div>
        <div class="qr-grid" id="qr-container"></div>
    </div>

    <!-- TAB 3: 學生人臉樣貌登記 -->
    <div id="tab-students" class="tab-content" style="display: none;">
        <div class="camera-box">
            <video id="reg-video" autoplay muted playsinline></video>
        </div>
        <div id="model-status" style="text-align: center; font-size: 0.8rem; color: #ff9800; margin-bottom: 8px;">🔄 正在載入 AI 人臉模型...</div>
        <div class="input-group">
            <label>學生學號：</label>
            <input type="text" id="reg-id" placeholder="例如: S001">
        </div>
        <div class="input-group">
            <label>學生姓名：</label>
            <input type="text" id="reg-name" placeholder="例如: 陳小明">
        </div>
        <button class="btn-primary" id="capture-btn" onclick="captureAndRegisterFace()" disabled>📷 正對鏡頭：擷取樣貌並儲存特徵</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://yenaiiwhfqgksuofnrjn.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_umYVSQBbOX8yQgdxL5TlbA_X9CXZKP_'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let supabaseChannel = null;
    let trackpointHeartbeats = {};
    let currentLapCount = 0;
    
    // 嚴格順序追蹤變數
    let expectedNextCp = 1; // 預期下一個要通過的檢查點 (從 1 開始)
    let lapStartTime = null; // 當前圈的起跑時間
    let recordedLapTimes = []; // 儲存每圈的秒數紀錄

    window.addEventListener('DOMContentLoaded', async () => {
        const loggedStudentId = sessionStorage.getItem('current_student_id');
        if (loggedStudentId) {
            document.getElementById('active-student-id').value = loggedStudentId;
            document.getElementById('reg-id').value = loggedStudentId;
        }

        updateStatusGrid();
        generateQRCodes();
        initHubRealtime();
        setInterval(checkTrackpointHealth, 2000);
        loadFaceModels();
    });

    async function loadFaceModels() {
        const MODEL_URL = './models';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            document.getElementById('model-status').innerText = '✅ AI 模型載入成功！';
            document.getElementById('model-status').style.color = '#4caf50';
            document.getElementById('capture-btn').disabled = false;
        } catch (err) {
            document.getElementById('model-status').innerText = '❌ 模型載入失敗，請檢查 /models 資料夾。';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });

        const tabs = { 'monitor': 0, 'qr': 1, 'students': 2 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';

        if (tabName === 'students') startRegistrationCamera();
        else stopRegistrationCamera();
    }

    let regStream = null;
    async function startRegistrationCamera() {
        const video = document.getElementById('reg-video');
        try {
            regStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            video.srcObject = regStream;
        } catch (e) { alert('無法開啟相機'); }
    }

    function stopRegistrationCamera() {
        if (regStream) { regStream.getTracks().forEach(t => t.stop()); regStream = null; }
    }

    async function captureAndRegisterFace() {
        const studentId = document.getElementById('reg-id').value.trim();
        const name = document.getElementById('reg-name').value.trim();
        if (!studentId || !name) { alert('請填寫完整資訊！'); return; }

        const video = document.getElementById('reg-video');
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        if (!detection) { alert('❌ 未偵測到清晰人臉！'); return; }

        try {
            const { error } = await supabaseClient.from('students_db').update({ face_encoding: JSON.stringify(Array.from(detection.descriptor)) }).eq('student_id', studentId);
            if (error) throw error;
            alert(`🎉 學號 [${studentId}] 人臉樣貌登記成功！`);
        } catch (err) { alert(`登記失敗: ${err.message}`); }
    }

    function initHubRealtime() {
        supabaseChannel = supabaseClient.channel('school_running_room', { config: { broadcast: { self: true } } });
        supabaseChannel
            .on('broadcast', { event: 'heartbeat' }, payload => { trackpointHeartbeats[payload.payload.checkpoint_id] = Date.now(); })
            .on('broadcast', { event: 'checkpoint_trigger' }, payload => { handleTrackpointTrigger(payload.payload.student_id, payload.payload.checkpoint_id, payload.payload.timestamp); })
            .subscribe();
    }

    function updateStatusGrid() {
        const count = parseInt(document.getElementById('cp-count-select').value);
        const grid = document.getElementById('status-grid-container');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${Math.min(count, 4)}, 1fr)`;

        for (let i = 1; i <= count; i++) {
            const card = document.createElement('div');
            card.className = 'status-card';
            card.id = `cp${i}-status`;
            card.innerHTML = `<div class="status-title">${i === 1 ? '檢查點 1 (起終點)' : `檢查點 ${i}`}</div><div class="status-indicator">離線</div>`;
            grid.appendChild(card);
        }
    }

    function checkTrackpointHealth() {
        const now = Date.now();
        const maxCp = parseInt(document.getElementById('cp-count-select').value);
        for (let i = 1; i <= maxCp; i++) {
            const card = document.getElementById(`cp${i}-status`);
            if (!card) continue;
            const indicator = card.querySelector('.status-indicator');
            if (now - (trackpointHeartbeats[i] || 0) < 6000) {
                card.classList.add('online');
                indicator.innerText = '🟢 連線中';
            } else {
                card.classList.remove('online');
                indicator.innerText = '🔴 離線';
            }
        }
    }

    // 🚀 嚴格順序過點驗證邏輯
    function handleTrackpointTrigger(studentId, cpId, timestamp) {
        const totalCps = parseInt(document.getElementById('cp-count-select').value);
        const logBox = document.getElementById('live-log');
        const timeStr = new Date(timestamp).toLocaleTimeString('zh-HK');

        if (logBox.innerHTML.includes('請由 CP1')) logBox.innerHTML = '';

        // 檢查是否為當前預期通過的站點
        if (cpId === expectedNextCp) {
            if (cpId === 1) {
                // 如果是起點/第一站
                if (lapStartTime === null) {
                    // 第一次出發，開始計時
                    lapStartTime = timestamp;
                    logBox.innerHTML = `<div class="log-item"><span>🚀 學生 [<b>${studentId}</b>] 從 <b>檢查點 1</b> 出發起跑！</span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                    speak('開始起跑');
                } else {
                    // 已經跑過一圈並回到 CP1，代表完成完整一圈！
                    const lapDurationSec = ((timestamp - lapStartTime) / 1000).toFixed(2);
                    currentLapCount++;
                    recordedLapTimes.push({ lap: currentLapCount, duration: parseFloat(lapDurationSec) });

                    document.getElementById('live-lap-counter').innerText = `完成圈數: ${currentLapCount} 圈`;
                    logBox.innerHTML = `<div class="log-item" style="background: #e8f5e9;"><span>🏆 <b>完成第 ${currentLapCount} 圈！</b> 圈速: <b>${lapDurationSec} 秒</b></span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                    speak(`完成第 ${currentLapCount} 圈，圈速 ${Math.floor(lapDurationSec)} 秒`);

                    // 重設下一圈計時起點
                    lapStartTime = timestamp;
                }
            } else {
                // 通過中途檢查點 (CP2, CP3...)
                logBox.innerHTML = `<div class="log-item"><span>學生 [<b>${studentId}</b>] 通過 <b>檢查點 ${cpId}</b></span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                speak(`檢查點 ${cpId} 通過`);
            }

            // 更新下一個預期通過的檢查點 (若到最後一站，下一個循環回到 CP1)
            expectedNextCp = (cpId % totalCps) + 1;

        } else {
            // ❌ 順序錯誤（例如漏站或逆向）
            logBox.innerHTML = `<div class="log-item" style="color: #d32f2f;"><span>⚠️ 順序錯誤：預期應通過 CP${expectedNextCp}，卻收到 CP${cpId}</span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
        }
    }

    function resetActiveStudent() {
        currentLapCount = 0;
        expectedNextCp = 1;
        lapStartTime = null;
        recordedLapTimes = [];
        document.getElementById('live-lap-counter').innerText = `完成圈數: 0 圈`;
        document.getElementById('live-log').innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">已重新計時，請由 CP1 出發...</div>`;
    }

    // 💾 將每一圈的「圈速」上傳至 Supabase
    async function uploadLapScores() {
        const studentId = document.getElementById('active-student-id').value.trim();
        if (!studentId) { alert('請先輸入學生學號！'); return; }
        if (recordedLapTimes.length === 0) { alert('尚無任何完成的圈速紀錄可上傳！'); return; }

        try {
            // 將每圈的圈速逐筆或打包上傳
            for (let item of recordedLapTimes) {
                const { error } = await supabaseClient
                    .from('fitness_records')
                    .insert([{ 
                        student_id: studentId, 
                        category: `running_lap_${item.lap}`, 
                        score_value: item.duration // 儲存秒數作為成績
                    }]);
                if (error) throw error;
            }

            alert(`🎉 成功上傳學號 ${studentId} 的 ${recordedLapTimes.length} 筆圈速成績至 Supabase！`);
        } catch (err) {
            alert(`上傳失敗: ${err.message}`);
        }
    }

    function generateQRCodes() {
        const count = parseInt(document.getElementById('cp-count-select').value);
        const container = document.getElementById('qr-container');
        container.innerHTML = '';
        const baseUrl = window.location.origin + window.location.pathname.replace('running_hub.html', 'running_cam.html');
        
        for (let i = 1; i <= count; i++) {
            const targetUrl = `${baseUrl}?role=cp${i}`;
            const box = document.createElement('div');
            box.className = 'qr-box';
            box.innerHTML = `
                <p style="margin: 0; font-weight: bold; color: #1565c0; font-size: 0.8rem;">${i === 1 ? 'CP1 (起終點)' : `CP${i}`}</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(targetUrl)}" alt="CP${i} QR">
                <p style="margin: 0; font-size: 0.65rem; color: #666; word-break: break-all;">?role=cp${i}</p>
            `;
            container.appendChild(box);
        }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => { const utter = new SpeechSynthesisUtterance(text); utter.lang = 'zh-HK'; synth.cancel(); synth.speak(utter); };
</script>

</body>
</html>
