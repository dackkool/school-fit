<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跑圈分站人臉辨識相機 | EveryRun Cam</title>
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #container { width: 100%; max-width: 500px; text-align: center; }
        #badge { background-color: #ff9800; padding: 8px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .video-wrapper { position: relative; width: 100%; max-height: 55vh; border-radius: 16px; overflow: hidden; border: 3px solid #ff9800; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status-text { margin-top: 15px; font-size: 0.95rem; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="container">
    <div id="badge">📷 正在載入分站...</div>
    <div class="video-wrapper">
        <video id="cam-video" autoplay muted playsinline></video>
        <canvas id="overlay-canvas"></canvas>
    </div>
    <div id="status-text">🔄 正在載入 AI 模型與學生人臉資料庫...</div>
</div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let role = 'cp1';
    let supabaseChannel = null;
    let lastSendTime = 0;
    let faceMatcher = null;
    let studentLastTrigger = {}; // 防重複觸發計時

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        role = urlParams.get('role') || 'cp1';
        document.getElementById('badge').innerText = `📡 分站相機：${role.toUpperCase()}`;

        initTrackpointRealtime();
        await loadModelsAndStudentFaceDB();
        startCamera();
    });

    async function loadModelsAndStudentFaceDB() {
        const MODEL_URL = './models';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            // 從 Supabase 載入有 face_encoding 的學生資料
            const { data, error } = await supabaseClient
                .from('students_db')
                .select('student_id, name, face_encoding')
                .not('face_encoding', 'is', null);

            if (error) throw error;

            if (!data || data.length === 0) {
                document.getElementById('status-text').innerText = '⚠️ 雲端尚無學生人臉數據，請先完成登記！';
                return;
            }

            const labeledDescriptors = [];
            data.forEach(student => {
                if (student.face_encoding) {
                    try {
                        const arr = new Float32Array(JSON.parse(student.face_encoding));
                        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(student.student_id, [arr]));
                    } catch (e) { console.error(e); }
                }
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
                document.getElementById('status-text').innerText = `✅ 人臉庫已載入 (${labeledDescriptors.length} 人)！相機準備就緒...`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('status-text').innerText = '❌ 模型或人臉數據載入失敗！';
        }
    }

    function initTrackpointRealtime() {
        supabaseChannel = supabaseClient.channel('school_running_room', { config: { broadcast: { self: true } } });
        supabaseChannel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                setInterval(() => {
                    supabaseChannel.send({
                        type: 'broadcast',
                        event: 'heartbeat',
                        payload: { checkpoint_id: parseInt(role.replace('cp', '')) }
                    });
                }, 3000);
            }
        });
    }

    async function startCamera() {
        const video = document.getElementById('cam-video');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 640, height: 480 } });
            video.srcObject = stream;
            video.addEventListener('play', onVideoPlay);
        } catch (err) {
            // 若後置失敗則使用前置
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = fallbackStream;
                video.addEventListener('play', onVideoPlay);
            } catch (e) {
                alert('無法存取相機！');
            }
        }
    }

    function onVideoPlay() {
        const video = document.getElementById('cam-video');
        const canvas = document.getElementById('overlay-canvas');

        setInterval(async () => {
            if (!faceMatcher || video.paused || video.ended) return;

            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const resizedDetections = faceapi.resizeResults(detections, displaySize);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resizedDetections.forEach(detection => {
                const match = faceMatcher.findBestMatch(detection.descriptor);
                const box = detection.detection.box;

                if (match.label !== 'unknown') {
                    const drawBox = new faceapi.draw.DrawBox(box, { label: `✅ ${match.label}`, boxColor: '#4caf50' });
                    drawBox.draw(canvas);
                    sendTriggerToHub(match.label);
                } else {
                    const drawBox = new faceapi.draw.DrawBox(box, { label: '未登記', boxColor: '#f44336' });
                    drawBox.draw(canvas);
                }
            });
        }, 600);
    }

    function sendTriggerToHub(studentId) {
        const now = Date.now();
        if (studentLastTrigger[studentId] && (now - studentLastTrigger[studentId] < 4000)) return;
        studentLastTrigger[studentId] = now;

        const cpId = parseInt(role.replace('cp', ''));

        supabaseChannel.send({
            type: 'broadcast',
            event: 'checkpoint_trigger',
            payload: { student_id: studentId, checkpoint_id: cpId, timestamp: now }
        });

        document.getElementById('status-text').innerText = `🎉 已發送 [${role.toUpperCase()}] 識別：學生 ${studentId}`;
    }
</script>

</body>
</html>
