<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學生仰臥起坐雲端挑戰</title>
    <!-- MediaPipe 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <!-- 引入 Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #app-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 2fr 1fr;
            overflow: hidden;
        }
        #video-container { position: relative; background-color: #f1f8e9; }
        .input_video { display: none; }
        .output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #ui-container { display: flex; flex-direction: column; padding: 20px; justify-content: space-around; }
        h1 { color: #ec407a; text-align: center; font-size: 2rem; margin: 0; }
        #timer { font-size: 2.5rem; color: #ff9800; font-weight: bold; text-align: center; }
        #situp-count { font-size: 6rem; color: #4caf50; font-weight: bold; text-align: center; margin: 0; }
        #feedback { background-color: #fff9c4; padding: 10px; border-radius: 10px; text-align: center; font-size: 1.1rem; border: 2px solid #fff176; }
        .input-group { margin: 5px 0; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.9rem; color: #555; }
        .input-group input { padding: 8px; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 12px; font-size: 1.1rem; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; color: white; background-color: #4caf50; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="video-container">
        <video class="input_video"></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <div id="ui-container">
        <h1>雲端仰臥起坐挑戰</h1>
        
        <div class="input-group">
            <label>請輸入你的學號：</label>
            <input type="text" id="student-id" placeholder="例如: S12345">
        </div>

        <div id="timer">倒數: 60s</div>
        <div id="situp-count">0</div>
        
        <div id="feedback">請輸入學號並點擊開始挑戰！</div>

        <button id="start-btn">開始挑戰！</button>
        <button id="stop-btn" style="background-color: #f44336; display: none;">結束並上傳成績</button>
    </div>
</div>

<script>
    // --- 1. 初始化 Supabase 連線 ---
    const SUPABASE_URL = 'https://你的Supabase_URL.supabase.co'; // 換成你的 URL
    const SUPABASE_ANON_KEY = '你的Supabase_Anon_Key';   // 換成你的 Anon Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const countDisplay = document.getElementById('situp-count');
    const timerDisplay = document.getElementById('timer');
    const feedbackDisplay = document.getElementById('feedback');
    const studentIdInput = document.getElementById('student-id');

    let situpCounter = 0;
    let stage = 'down';
    let isRunning = false;
    let timeLeft = 60;
    let countdownInterval;

    const synth = window.speechSynthesis;
    const speak = (text) => {
        const utter = new SpeechSynthesisUtterance(text);
        synth.cancel();
        synth.speak(utter);
    };

    function calculateAngle(a, b, c) {
        const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        if (angle > 180.0) angle = 360 - angle;
        return angle;
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.scale(-1, 1);
        canvasCtx.translate(-canvasElement.width, 0);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();

        if (results.poseLandmarks && isRunning) {
            const landmarks = results.poseLandmarks;
            const side = landmarks[12].visibility > landmarks[11].visibility ? 'right' : 'left';
            const shoulder = side === 'right' ? landmarks[12] : landmarks[11];
            const hip = side === 'right' ? landmarks[24] : landmarks[23];
            const knee = side === 'right' ? landmarks[26] : landmarks[25];

            const hipAngle = calculateAngle(shoulder, hip, knee);

            if (stage === 'down' && hipAngle < 70) {
                stage = 'up';
                situpCounter++;
                countDisplay.innerText = situpCounter;
                speak(situpCounter.toString());
                feedbackDisplay.innerText = "做得好！繼續保持！";
            } else if (stage === 'up' && hipAngle > 140) {
                stage = 'down';
            }
        }
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
    });

    startBtn.addEventListener('click', () => {
        const studentId = studentIdInput.value.trim();
        if (!studentId) {
            alert('請先輸入學號才可以開始挑戰！');
            return;
        }

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        studentIdInput.disabled = true;
        
        situpCounter = 0;
        countDisplay.innerText = '0';
        timeLeft = 60;
        timerDisplay.innerText = '倒數: 60s';
        isRunning = true;
        
        speak("挑戰開始！");
        camera.start();

        countdownInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = `倒數: ${timeLeft}s`;
            if (timeLeft <= 0) {
                endChallenge();
            }
        }, 1000);
    });

    stopBtn.addEventListener('click', endChallenge);

    async function endChallenge() {
        clearInterval(countdownInterval);
        isRunning = false;
        camera.stop();
        
        const studentId = studentIdInput.value.trim();
        feedbackDisplay.innerText = `時間到！正在將成績上傳至雲端...`;
        speak(`時間到！總共做了 ${situpCounter} 下。`);

        // --- 2. 將成績寫入 Supabase 雲端資料庫 ---
        try {
            const { data, error } = await supabaseClient
                .from('fitness_records')
                .insert([
                    { student_id: studentId, score: situpCounter }
                ]);

            if (error) {
                console.error(error);
                feedbackDisplay.innerText = `上傳失敗：${error.message}`;
            } else {
                feedbackDisplay.innerText = `成績已成功上傳！學號 ${studentId} 獲得 ${situpCounter} 下。`;
            }
        } catch (err) {
            feedbackDisplay.innerText = `網絡連線錯誤！`;
        }

        startBtn.style.display = 'inline-block';
        startBtn.innerText = '再次挑戰';
        stopBtn.style.display = 'none';
        studentIdInput.disabled = false;
    }
</script>

</body>
</html>
