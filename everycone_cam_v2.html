<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錐桶與ArUco分站相機 v2 | EveryCone Cam</title>
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- OpenCV.js (用於 ArUco 檢測) -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #container { width: 100%; max-width: 500px; text-align: center; }
        #badge { background-color: #4caf50; padding: 8px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        
        .camera-select-group { margin-bottom: 10px; text-align: left; }
        .camera-select-group label { font-size: 0.85rem; color: #4caf50; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px 10px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #4caf50; background: #222; color: white; }

        .zoom-control-group { margin-bottom: 10px; text-align: left; background: #222; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; display: none; }
        .zoom-control-group label { font-size: 0.85rem; color: #ff9800; font-weight: bold; display: flex; justify-content: space-between; }
        .zoom-control-group input[type=range] { width: 100%; margin-top: 5px; }

        .video-wrapper { position: relative; width: 100%; max-height: 50vh; border-radius: 16px; overflow: hidden; border: 3px solid #4caf50; background: #000; display: flex; justify-content: center; align-items: center; }
        
        /* 使用 contain 避免裁切廣角畫面邊緣 */
        video { width: 100%; height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        .control-panel { display: flex; gap: 8px; margin-top: 10px; }
        .btn-action { flex: 1; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; transition: 0.2s; }
        .btn-calibrate { background-color: #ff9800; }
        .btn-lock { background-color: #2196f3; }
        .btn-action:active { opacity: 0.8; }

        #status-text { margin-top: 10px; font-size: 0.95rem; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="container">
    <div id="badge">📷 正在載入錐桶分站相機 v2...</div>
    
    <div class="camera-select-group">
        <label>選擇相機鏡頭（優先調用後置超廣角）：</label>
        <select id="camera-select">
            <option value="">正在偵測可用鏡頭...</option>
        </select>
    </div>

    <div class="zoom-control-group" id="zoom-container">
        <label>🔍 廣角 / 光學數位縮放：<span id="zoom-value">1.0x</span></label>
        <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1">
    </div>

    <div class="video-wrapper">
        <video id="cam-video" autoplay muted playsinline></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <div class="control-panel">
        <button class="btn-action btn-calibrate" onclick="reCalibrateBoundary()">🎯 重新偵測 ArUco 界線</button>
        <button class="btn-action btn-lock" onclick="toggleBoundaryLock()"><span id="lock-btn-text">🔒 鎖定界線 (省電模式)</span></button>
    </div>

    <div id="status-text">🔄 正在載入 AI 模型與廣角鏡頭優化模組...</div>
</div>

<script>
    const SUPABASE_URL = 'YOUR SUPA URL'; 
    const SUPABASE_ANON_KEY = 'YOUR ANON CODE'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let role = 'cp1';
    let sessionId = 'default';
    let supabaseChannel = null;
    let faceMatcher = null;
    let studentLastTrigger = {}; 
    let currentStream = null;
    let activeVideoTrack = null;
    
    let cvReady = false;
    let isBoundaryLocked = false;
    let activeBoundaryLine = null;
    let detectedArucoId = null;

    let analysisCanvas = document.createElement('canvas');
    let analysisCtx = analysisCanvas.getContext('2d');

    function onOpenCvReady() {
        cvReady = true;
        console.log("OpenCV.js 載入成功！已就緒進行 ArUco 界線定位。");
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        role = urlParams.get('role') || 'cp1';
        sessionId = urlParams.get('session') || 'default';
        
        document.getElementById('badge').innerText = `📡 分站相機：${role.toUpperCase()} (超廣角優化版)`;

        initTrackpointRealtime();
        await loadModelsAndStudentFaceDB();
        await initCameraDevices();
    });

    async function loadModelsAndStudentFaceDB() {
        const MODEL_URL = './models';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            const { data, error } = await supabaseClient
                .from('students_db')
                .select('student_id, name, face_encoding')
                .not('face_encoding', 'is', null);

            if (error) throw error;

            if (!data || data.length === 0) {
                document.getElementById('status-text').innerText = '⚠️ 雲端尚無學生人臉數據，請先在主機登記！';
                return;
            }

            const labeledDescriptors = [];
            data.forEach(student => {
                if (student.face_encoding) {
                    try {
                        const arr = new Float32Array(JSON.parse(student.face_encoding));
                        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(student.student_id, [arr]));
                    } catch (e) { console.error(e); }
                }
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
                document.getElementById('status-text').innerText = `✅ 相機就緒！請確認已啟用後置超廣角鏡頭。`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('status-text').innerText = '❌ 模型或人臉數據載入失敗！';
        }
    }

    function initTrackpointRealtime() {
        supabaseChannel = supabaseClient.channel(`school_conev2_room_${sessionId}`, { config: { broadcast: { self: true } } });
        supabaseChannel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                setInterval(() => {
                    supabaseChannel.send({
                        type: 'broadcast',
                        event: 'heartbeat',
                        payload: { checkpoint_id: parseInt(role.replace('cp', '')) }
                    });
                }, 3000);
            }
        });
    }

    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            tempStream.getTracks().forEach(track => track.stop());

            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');

            cameraSelect.innerHTML = '';
            if (videoDevices.length === 0) {
                cameraSelect.innerHTML = '<option value="">找不到可用鏡頭</option>';
                startCamera(null);
                return;
            }

            let bestDeviceId = null;
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                const label = device.label.toLowerCase();
                
                let isUltraWide = label.includes('ultra') || label.includes('wide') || label.includes('0.5') || label.includes('廣角') || label.includes('back 0');
                let isBack = label.includes('back') || label.includes('rear') || label.includes('後');

                option.text = device.label ? `${device.label}${isUltraWide ? ' 🌟(廣角/Ultra-wide)' : ''}` : `鏡頭 ${index + 1}`;
                
                // 優先選擇後置超廣角鏡頭
                if (isUltraWide && !bestDeviceId) {
                    bestDeviceId = device.deviceId;
                } else if (isBack && !bestDeviceId) {
                    bestDeviceId = device.deviceId;
                }

                cameraSelect.appendChild(option);
            });

            if (!bestDeviceId && videoDevices.length > 0) bestDeviceId = videoDevices[videoDevices.length - 1].deviceId;
            if (bestDeviceId) cameraSelect.value = bestDeviceId;

            await startCamera(cameraSelect.value);

            cameraSelect.addEventListener('change', async (e) => {
                await startCamera(e.target.value);
            });
        } catch (err) {
            console.error('無法讀取鏡頭列表:', err);
            cameraSelect.innerHTML = '<option value="">無法存取相機權限</option>';
            await startCamera(null);
        }
    }

    async function startCamera(deviceId) {
        const video = document.getElementById('cam-video');
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());

        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 640 }, height: { ideal: 480 } } 
                            : { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            activeVideoTrack = currentStream.getVideoTracks()[0];
            
            // 啟用 Zoom 控制 API (如硬體支援)
            setupZoomControls(activeVideoTrack);

            // 判斷是否為前置鏡頭（若為前置則翻轉，後置廣角不翻轉）
            const label = activeVideoTrack.label.toLowerCase();
            const isFront = label.includes('front') || label.includes('user') || label.includes('前');
            video.style.transform = isFront ? 'scaleX(-1)' : 'none';
            document.getElementById('overlay-canvas').style.transform = isFront ? 'scaleX(-1)' : 'none';

            video.onplay = () => onVideoPlay();
        } catch (err) {
            console.error('啟動鏡頭失敗:', err);
            alert('無法啟動所選鏡頭！');
        }
    }

    function setupZoomControls(track) {
        const zoomContainer = document.getElementById('zoom-container');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValueDisplay = document.getElementById('zoom-value');

        if (!track || typeof track.getCapabilities !== 'function') {
            zoomContainer.style.display = 'none';
            return;
        }

        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
            zoomContainer.style.display = 'block';
            zoomSlider.min = capabilities.zoom.min;
            zoomSlider.max = capabilities.zoom.max;
            zoomSlider.step = capabilities.zoom.step || 0.1;
            
            const settings = track.getSettings();
            zoomSlider.value = settings.zoom || capabilities.zoom.min;
            zoomValueDisplay.innerText = parseFloat(zoomSlider.value).toFixed(1) + 'x';

            zoomSlider.oninput = (e) => {
                const val = parseFloat(e.target.value);
                zoomValueDisplay.innerText = val.toFixed(1) + 'x';
                track.applyConstraints({ advanced: [{ zoom: val }] });
            };
        } else {
            zoomContainer.style.display = 'none';
        }
    }

    function detectArUcoMarker(video) {
        if (!cvReady || typeof cv.aruco === 'undefined') return null;

        try {
            let width = 320;
            let height = 240;
            if (analysisCanvas.width !== width) {
                analysisCanvas.width = width;
                analysisCanvas.height = height;
            }

            analysisCtx.drawImage(video, 0, 0, width, height);
            let src = cv.imread(analysisCanvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR.RGBA2GRAY, 0);

            let corners = new cv.MatVector();
            let ids = new cv.Mat();
            let dictionary = cv.aruco.getPredefinedDictionary(cv.aruco.DICT_4X4_50);
            let parameters = new cv.aruco.DetectorParameters();

            cv.aruco.detectMarkers(gray, dictionary, corners, ids, parameters);

            let result = null;
            if (ids.rows > 0) {
                let idVal = ids.data32S[0];
                let cornerMat = corners.get(0);
                let x = cornerMat.data32F[0];
                let y = cornerMat.data32F[1];
                
                result = { id: idVal, x: x, y: y };
            }

            src.delete(); gray.delete(); corners.delete(); ids.delete(); parameters.delete();
            return result;
        } catch (err) {
            return null;
        }
    }

    function reCalibrateBoundary() {
        isBoundaryLocked = false;
        activeBoundaryLine = null;
        document.getElementById('lock-btn-text').innerText = '🔒 鎖定界線 (省電模式)';
        document.getElementById('status-text').innerText = '🎯 已開啟 ArUco 掃描！請將相機對準雪糕桶上的標記...';
    }

    function toggleBoundaryLock() {
        isBoundaryLocked = !isBoundaryLocked;
        const lockText = document.getElementById('lock-btn-text');
        if (isBoundaryLocked) {
            lockText.innerText = '🔓 解鎖界線 (重開啟動 ArUco 偵測)';
            document.getElementById('status-text').innerText = '🔒 界線已鎖定！已關閉 OpenCV 釋放 CPU，流暢執行人臉辨識中。';
        } else {
            lockText.innerText = '🔒 鎖定界線 (省電模式)';
            document.getElementById('status-text').innerText = '🔓 界線偵測已開啟。';
        }
    }

    function onVideoPlay() {
        const video = document.getElementById('cam-video');
        const canvas = document.getElementById('overlay-canvas');

        if (window.detectionInterval) clearInterval(window.detectionInterval);

        window.detectionInterval = setInterval(async () => {
            if (!faceMatcher || video.paused || video.ended) return;

            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isBoundaryLocked) {
                const arucoRes = detectArUcoMarker(video);
                if (arucoRes) {
                    detectedArucoId = arucoRes.id;
                    const scaleX = displaySize.width / 320;
                    const markerX = arucoRes.x * scaleX;
                    activeBoundaryLine = { x: markerX, id: arucoRes.id };
                    document.getElementById('status-text').innerText = `✅ 成功定位 ArUco #${arucoRes.id}！3D 界線已自動對齊。`;
                }
            }

            if (activeBoundaryLine) {
                ctx.strokeStyle = '#00e676';
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 4]);
                ctx.beginPath();
                ctx.moveTo(activeBoundaryLine.x, 0);
                ctx.lineTo(activeBoundaryLine.x, displaySize.height);
                ctx.stroke();

                ctx.fillStyle = '#00e676';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`界線 [ArUco #${activeBoundaryLine.id}]`, activeBoundaryLine.x + 8, 24);
                ctx.setLineDash([]);
            }

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const resizedDetections = faceapi.resizeResults(detections, displaySize);

            resizedDetections.forEach(detection => {
                const match = faceMatcher.findBestMatch(detection.descriptor);
                const box = detection.detection.box;

                if (match.label !== 'unknown') {
                    const labelText = detectedArucoId !== null ? `✅ ${match.label} [ArUco #${detectedArucoId}]` : `✅ ${match.label}`;
                    const drawBox = new faceapi.draw.DrawBox(box, { label: labelText, boxColor: '#4caf50' });
                    drawBox.draw(canvas);

                    sendTriggerToHub(match.label, detectedArucoId);
                } else {
                    const drawBox = new faceapi.draw.DrawBox(box, { label: '未登記', boxColor: '#f44336' });
                    drawBox.draw(canvas);
                }
            });
        }, 200);
    }

    function sendTriggerToHub(studentId, arucoId) {
        const now = Date.now();
        if (studentLastTrigger[studentId] && (now - studentLastTrigger[studentId] < 6000)) return;
        studentLastTrigger[studentId] = now;

        const cpId = parseInt(role.replace('cp', ''));

        supabaseChannel.send({
            type: 'broadcast',
            event: 'checkpoint_trigger',
            payload: { student_id: studentId, checkpoint_id: cpId, aruco_id: arucoId, timestamp: now }
        });

        document.getElementById('status-text').innerText = `🎉 已發送 [${role.toUpperCase()}] 過點：學生 ${studentId}${arucoId !== null ? ' (經雪糕桶#'+arucoId+')' : ''}`;
    }
</script>

</body>
</html>
