<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全班智慧跑圈統籌主機 | EveryRun Hub</title>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 15px; background-color: #e3f2fd; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 950px; background-color: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 20px; }
        h1 { color: #1565c0; font-size: 1.5rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 15px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 0.95rem; font-weight: bold; color: #888; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #1565c0; border-bottom: 3.5px solid #1565c0; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .status-card { background: #f5f5f5; border: 2px solid #ddd; border-radius: 12px; padding: 10px; text-align: center; }
        .status-card.online { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .status-title { font-size: 0.75rem; font-weight: bold; }
        .status-indicator { font-size: 0.9rem; margin-top: 4px; font-weight: bold; }

        .qr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 10px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .qr-box { background: #fafafa; border: 1.5px dashed #1565c0; border-radius: 12px; padding: 10px; text-align: center; }
        .qr-box img { width: 120px; height: 120px; margin: 5px auto; display: block; }

        #live-log { background: #fafafa; border: 1px solid #ddd; border-radius: 10px; height: 260px; overflow-y: auto; padding: 10px; font-size: 0.9rem; margin-bottom: 10px; }
        .log-item { padding: 6px 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        .history-container { background: #fafafa; border: 1px solid #ddd; border-radius: 12px; padding: 15px; max-height: 400px; overflow-y: auto; }
        table.history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        table.history-table th, table.history-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        table.history-table th { background-color: #f5f5f5; color: #333; }

        .input-group { margin-bottom: 10px; }
        .input-group label { font-size: 0.85rem; color: #444; font-weight: bold; display: block; margin-bottom: 4px; }
        .input-group select { width: 100%; padding: 8px 10px; font-size: 0.95rem; border-radius: 8px; border: 1.5px solid #ccc; }

        button.btn-primary { width: 100%; padding: 10px; font-size: 1rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #1565c0; margin-top: 5px; }
        button.btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>全班智慧跑圈統籌主機 (EveryRun Hub)</h1>
    <div class="subtitle">獨立賽事現場統計・多站順序驗證・即時排行榜與 CSV 匯出</div>

    <div class="status-grid" id="status-grid-container"></div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('monitor')">⚡ 獨立賽事實況監控</button>
        <button class="tab-btn" onclick="switchTab('qr')">📱 生成分機 QR (2-8)</button>
        <button class="tab-btn" onclick="switchTab('ranking')">🏆 本次比賽排行榜 & 匯出</button>
    </div>

    <!-- TAB 1: 獨立賽事實況監控 -->
    <div id="tab-monitor" class="tab-content active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <strong>📡 賽事進行中（各分站自動廣播）：</strong>
            <button class="btn-primary" onclick="resetCurrentRace()" style="width: auto; padding: 4px 12px; font-size: 0.8rem; margin: 0; background-color: #d32f2f;">🔄 重置 / 開始新比賽</button>
        </div>
        <div id="live-log">
            <div style="text-align: center; color: #888; padding: 30px;">比賽準備就緒，等待學生由 CP1 出發...</div>
        </div>
    </div>

    <!-- TAB 2: 生成分機 QR Code -->
    <div id="tab-qr" class="tab-content" style="display: none;">
        <div class="input-group">
            <label>選擇總分站數量 (2 至 8 個)：</label>
            <select id="cp-count-select" onchange="generateQRCodes(); updateStatusGrid();">
                <option value="2">2 個檢查點 (CP1, CP2)</option>
                <option value="3">3 個檢查點 (CP1, CP2, CP3)</option>
                <option value="4" selected>4 個檢查點 (CP1 ~ CP4)</option>
                <option value="5">5 個檢查點 (CP1 ~ CP5)</option>
                <option value="6">6 個檢查點 (CP1 ~ CP6)</option>
                <option value="7">7 個檢查點 (CP1 ~ CP7)</option>
                <option value="8">8 個檢查點 (CP1 ~ CP8)</option>
            </select>
        </div>
        <div class="qr-grid" id="qr-container"></div>
    </div>

    <!-- TAB 3: 本次比賽排行榜 & CSV 匯出 -->
    <div id="tab-ranking" class="tab-content" style="display: none;">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn-primary" onclick="renderCurrentRaceRanking()" style="flex: 1; background-color: #2e7d32; margin: 0;">🏁 比賽完結 / 結算排行榜</button>
            <button class="btn-primary" onclick="exportToCSV()" style="flex: 1; background-color: #ff9800; margin: 0;">📥 下載 .CSV 成績單</button>
        </div>
        <div class="history-container">
            <div id="ranking-summary" style="margin-bottom: 10px; font-size: 0.9rem; color: #333; font-weight: bold;">
                請點擊「比賽完結」進行排名結算。
            </div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>學生學號</th>
                        <th>學生姓名</th>
                        <th>完成圈數</th>
                        <th>總花費時間</th>
                        <th>平均圈速</th>
                    </tr>
                </thead>
                <tbody id="ranking-tbody">
                    <tr><td colspan="6" style="color: #888; padding: 20px;">賽事進行中，尚未進行結算</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://yenaiiwhfqgksuofnrjn.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_umYVSQBbOX8yQgdxL5TlbA_X9CXZKP_'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let supabaseChannel = null;
    let trackpointHeartbeats = {};
    let studentNameMap = {}; // 學號對應姓名的快取

    // 🏆 本次獨立賽事專用數據結構 (純記憶體運行)
    // 結構: { 'S001': { expectedCp: 1, lapStartTime: null, completedLaps: 0, totalDuration: 0, lapDetails: [] } }
    let liveRaceData = {};
    let calculatedRankings = []; // 儲存最終結算清單用作 CSV 匯出

    window.addEventListener('DOMContentLoaded', async () => {
        updateStatusGrid();
        generateQRCodes();
        initHubRealtime();
        setInterval(checkTrackpointHealth, 2000);

        // 載入學生姓名資料庫（純查詢對照用，不寫入往績）
        try {
            const { data } = await supabaseClient.from('students_db').select('student_id, name');
            if (data) {
                data.forEach(s => { studentNameMap[s.student_id] = s.name; });
            }
        } catch (e) { console.error("學生資料載入失敗", e); }
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });

        const tabs = { 'monitor': 0, 'qr': 1, 'ranking': 2 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';

        if (tabName === 'ranking') {
            renderCurrentRaceRanking();
        }
    }

    function initHubRealtime() {
        supabaseChannel = supabaseClient.channel('school_running_room', { config: { broadcast: { self: true } } });
        supabaseChannel
            .on('broadcast', { event: 'heartbeat' }, payload => { 
                trackpointHeartbeats[payload.payload.checkpoint_id] = Date.now(); 
            })
            .on('broadcast', { event: 'checkpoint_trigger' }, payload => { 
                handleRaceTrigger(payload.payload.student_id, payload.payload.checkpoint_id, payload.payload.timestamp); 
            })
            .subscribe();
    }

    // 🚀 核心邏輯：獨立賽事多學生同時順序過點驗證
    function handleRaceTrigger(studentId, cpId, timestamp) {
        const totalCps = parseInt(document.getElementById('cp-count-select').value);
        const logBox = document.getElementById('live-log');
        const timeStr = new Date(timestamp).toLocaleTimeString('zh-HK');
        const studentName = studentNameMap[studentId] || studentId;

        if (logBox.innerHTML.includes('比賽準備就緒')) logBox.innerHTML = '';

        // 若為新學生，初始化該生數據
        if (!liveRaceData[studentId]) {
            liveRaceData[studentId] = {
                expectedCp: 1,
                lapStartTime: null,
                completedLaps: 0,
                totalDuration: 0,
                lapDetails: []
            };
        }

        const runner = liveRaceData[studentId];

        // 順序驗證邏輯
        if (cpId === runner.expectedCp) {
            if (cpId === 1) {
                if (runner.lapStartTime === null) {
                    // 起跑出發
                    runner.lapStartTime = timestamp;
                    logBox.innerHTML = `<div class="log-item"><span>🚀 學生 <b>${studentName} (${studentId})</b> 從 <b>CP1 起點</b> 出發！</span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                    speak(`${studentName} 起跑`);
                } else {
                    // 完成一圈
                    const lapDuration = parseFloat(((timestamp - runner.lapStartTime) / 1000).toFixed(2));
                    runner.completedLaps++;
                    runner.totalDuration += lapDuration;
                    runner.lapDetails.push(lapDuration);

                    logBox.innerHTML = `<div class="log-item" style="background: #e8f5e9;"><span>🏆 <b>${studentName} (${studentId})</b> 完成第 <b>${runner.completedLaps}</b> 圈！圈速: <b>${lapDuration} 秒</b></span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                    speak(`${studentName} 完成第 ${runner.completedLaps} 圈`);

                    runner.lapStartTime = timestamp; // 設定下一圈起跑點
                }
            } else {
                // 通過中途檢查點
                logBox.innerHTML = `<div class="log-item"><span>學生 <b>${studentName} (${studentId})</b> 通過 <b>檢查點 ${cpId}</b></span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
                speak(`${studentName} 通過檢查點 ${cpId}`);
            }

            // 更新預期下一站
            runner.expectedCp = (cpId % totalCps) + 1;
        } else {
            // 順序不符 (跳站)
            logBox.innerHTML = `<div class="log-item" style="color: #d32f2f;"><span>⚠️ 順序提示：${studentName} 應過 CP${runner.expectedCp}，卻收到 CP${cpId}</span><span style="color:#666;">${timeStr}</span></div>` + logBox.innerHTML;
        }
    }

    // 🏆 計算與渲染本次獨立賽事排行榜
    function renderCurrentRaceRanking() {
        const tbody = document.getElementById('ranking-tbody');
        const summary = document.getElementById('ranking-summary');

        const studentIds = Object.keys(liveRaceData);
        if (studentIds.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="color: #888; padding: 20px;">賽事進行中，尚未有學生通過檢查點</td></tr>`;
            summary.innerHTML = `🏁 比賽結算：暫無參賽記錄。`;
            calculatedRankings = [];
            return;
        }

        // 轉換為陣列並進行排序 (完成圈數多者優先；若圈數相同，則總時間少者優先)
        calculatedRankings = studentIds.map(id => {
            const data = liveRaceData[id];
            const name = studentNameMap[id] || '未命名';
            const avgSpeed = data.completedLaps > 0 ? (data.totalDuration / data.completedLaps).toFixed(2) : '0.00';
            return {
                studentId: id,
                name: name,
                completedLaps: data.completedLaps,
                totalDuration: parseFloat(data.totalDuration.toFixed(2)),
                avgSpeed: avgSpeed
            };
        }).sort((a, b) => {
            if (b.completedLaps !== a.completedLaps) return b.completedLaps - a.completedLaps;
            return a.totalDuration - b.totalDuration;
        });

        tbody.innerHTML = '';
        calculatedRankings.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><b>#${index + 1}</b></td>
                    <td>${item.studentId}</td>
                    <td>${item.name}</td>
                    <td><span style="background: #e3f2fd; color: #1565c0; padding: 2px 8px; border-radius: 4px; font-weight: bold;">${item.completedLaps} 圈</span></td>
                    <td><b>${item.totalDuration}</b> 秒</td>
                    <td>${item.avgSpeed} 秒/圈</td>
                </tr>
            `;
        });

        summary.innerHTML = `🏁 <b>本次比賽已結算：</b> 共 ${calculatedRankings.length} 名參賽學生已統計完畢！`;
    }

    // 📥 將排行榜匯出為 .CSV 檔案
    function exportToCSV() {
        if (calculatedRankings.length === 0) {
            alert('尚無比賽排名數據可匯出！');
            return;
        }

        let csvContent = "\uFEFF"; // 加入 UTF-8 BOM 避免 Excel 中文亂碼
        csvContent += "名次,學生學號,學生姓名,完成圈數,總花費時間(秒),平均圈速(秒/圈)\n";

        calculatedRankings.forEach((item, index) => {
            csvContent += `${index + 1},"${item.studentId}","${item.name}",${item.completedLaps},${item.totalDuration},${item.avgSpeed}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        const today = new Date().toISOString().slice(0, 10);
        link.setAttribute("href", url);
        link.setAttribute("download", `EveryRun_Race_Results_${today}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function resetCurrentRace() {
        if (confirm('確定要重置並開始一場全新的比賽嗎？目前的過點記錄將會清空！')) {
            liveRaceData = {};
            calculatedRankings = [];
            document.getElementById('live-log').innerHTML = `<div style="text-align: center; color: #888; padding: 30px;">比賽已重置，等待學生由 CP1 出發...</div>`;
            renderCurrentRaceRanking();
        }
    }

    function updateStatusGrid() {
        const count = parseInt(document.getElementById('cp-count-select').value);
        const grid = document.getElementById('status-grid-container');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${Math.min(count, 4)}, 1fr)`;

        for (let i = 1; i <= count; i++) {
            const card = document.createElement('div');
            card.className = 'status-card';
            card.id = `cp${i}-status`;
            card.innerHTML = `<div class="status-title">${i === 1 ? '檢查點 1 (起終點)' : `檢查點 ${i}`}</div><div class="status-indicator">離線</div>`;
            grid.appendChild(card);
        }
    }

    function checkTrackpointHealth() {
        const now = Date.now();
        const maxCp = parseInt(document.getElementById('cp-count-select').value);
        for (let i = 1; i <= maxCp; i++) {
            const card = document.getElementById(`cp${i}-status`);
            if (!card) continue;
            const indicator = card.querySelector('.status-indicator');
            if (now - (trackpointHeartbeats[i] || 0) < 6000) {
                card.classList.add('online');
                indicator.innerText = '🟢 連線中';
            } else {
                card.classList.remove('online');
                indicator.innerText = '🔴 離線';
            }
        }
    }

    function generateQRCodes() {
        const count = parseInt(document.getElementById('cp-count-select').value);
        const container = document.getElementById('qr-container');
        container.innerHTML = '';
        const baseUrl = window.location.origin + window.location.pathname.replace('everyrun_hub.html', 'everyrun_cam.html');
        
        for (let i = 1; i <= count; i++) {
            const targetUrl = `${baseUrl}?role=cp${i}`;
            const box = document.createElement('div');
            box.className = 'qr-box';
            box.innerHTML = `
                <p style="margin: 0; font-weight: bold; color: #1565c0; font-size: 0.8rem;">${i === 1 ? 'CP1 (起終點)' : `CP${i}`}</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(targetUrl)}" alt="CP${i} QR">
                <p style="margin: 0; font-size: 0.65rem; color: #666; word-break: break-all;">?role=cp${i}</p>
            `;
            container.appendChild(box);
        }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => { const utter = new SpeechSynthesisUtterance(text); utter.lang = 'zh-HK'; synth.cancel(); synth.speak(utter); };
</script>

</body>
</html>
