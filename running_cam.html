<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跑圈分站人臉辨識相機 | Trackpoint</title>
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #container { width: 100%; max-width: 500px; text-align: center; }
        #badge { background-color: #ff9800; padding: 8px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        
        /* 鏡頭選擇選單樣式 */
        .camera-select-group { margin-bottom: 10px; text-align: left; }
        .camera-select-group label { font-size: 0.85rem; color: #ff9800; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px 10px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #ff9800; background: #222; color: white; }

        .video-wrapper { position: relative; width: 100%; max-height: 50vh; border-radius: 16px; overflow: hidden; border: 3px solid #ff9800; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* 前置鏡頭水平翻轉，鏡像顯示較自然 */ }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); /* 同步翻轉 Canvas 標框 */ }
        #status-text { margin-top: 15px; font-size: 0.95rem; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="container">
    <div id="badge">📷 正在載入分站...</div>
    
    <!-- 鏡頭選擇選單 -->
    <div class="camera-select-group">
        <label>選擇相機鏡頭：</label>
        <select id="camera-select">
            <option value="">正在偵測可用鏡頭...</option>
        </select>
    </div>

    <div class="video-wrapper">
        <video id="cam-video" autoplay muted playsinline></video>
        <canvas id="overlay-canvas"></canvas>
    </div>
    <div id="status-text">🔄 正在從雲端載入人臉數據庫與 AI 模型...</div>
</div>

<script>
    const SUPABASE_URL = 'https://yenaiiwhfqgksuofnrjn.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_umYVSQBbOX8yQgdxL5TlbA_X9CXZKP_'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let role = 'cp1';
    let supabaseChannel = null;
    let lastSendTime = 0;
    let faceMatcher = null;
    let currentStream = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        role = urlParams.get('role') || 'cp1';
        document.getElementById('badge').innerText = `📡 分站相機：${role.toUpperCase()}`;

        initTrackpointRealtime();
        await loadModelsAndStudentFaceDB();
        await initCameraDevices(); // 初始化並自動抓取可用鏡頭
    });

    async function loadModelsAndStudentFaceDB() {
        const MODEL_URL = './models';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            const { data, error } = await supabaseClient
                .from('students_db')
                .select('student_id, name, face_encoding')
                .not('face_encoding', 'is', null);

            if (error) throw error;

            if (!data || data.length === 0) {
                document.getElementById('status-text').innerText = '⚠️ 雲端尚無學生樣貌數據，請先在 Hub 主機進行登記！';
                return;
            }

            const labeledDescriptors = [];
            data.forEach(student => {
                if (student.face_encoding) {
                    try {
                        const arr = new Float32Array(JSON.parse(student.face_encoding));
                        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(student.student_id, [arr]));
                    } catch (e) { console.error(e); }
                }
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
                document.getElementById('status-text').innerText = `✅ 人臉庫已載入 (${labeledDescriptors.length} 人)！相機就緒，請看鏡頭...`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('status-text').innerText = '❌ 人臉模型或數據庫載入失敗！';
        }
    }

    function initTrackpointRealtime() {
        supabaseChannel = supabaseClient.channel('school_running_room', { config: { broadcast: { self: true } } });
        supabaseChannel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                setInterval(() => {
                    supabaseChannel.send({
                        type: 'broadcast',
                        event: 'heartbeat',
                        payload: { checkpoint_id: parseInt(role.replace('cp', '')) }
                    });
                }, 3000);
            }
        });
    }

    // 🚀 自動偵測裝置中所有可用鏡頭，預設選取前置鏡頭並填入選單
    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            // 先取得一次權限以解鎖裝置完整名稱
            const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
            tempStream.getTracks().forEach(track => track.stop());

            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');

            cameraSelect.innerHTML = '';
            if (videoDevices.length === 0) {
                cameraSelect.innerHTML = '<option value="">找不到可用鏡頭</option>';
                startCamera(null);
                return;
            }

            let defaultDeviceId = null;
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `鏡頭 ${index + 1}`;
                
                // 優先自動尋找包含 "front"、"user" 或 "前置" 的鏡頭作為預設值
                const labelLower = device.label.toLowerCase();
                if (labelLower.includes('front') || labelLower.includes('user') || labelLower.includes('前') || index === 0) {
                    if (!defaultDeviceId || labelLower.includes('front') || labelLower.includes('user') || labelLower.includes('前')) {
                        defaultDeviceId = device.deviceId;
                    }
                }
                cameraSelect.appendChild(option);
            });

            if (defaultDeviceId) {
                cameraSelect.value = defaultDeviceId;
            }

            // 啟動預設鏡頭
            await startCamera(cameraSelect.value);

            // 監聽下拉選單切換事件
            cameraSelect.addEventListener('change', async (e) => {
                await startCamera(e.target.value);
            });

        } catch (err) {
            console.error('無法讀取鏡頭列表:', err);
            cameraSelect.innerHTML = '<option value="">無法存取相機權限</option>';
            await startCamera(null); // Fallback 預設啟動
        }
    }

    // 🚀 啟動指定的鏡頭裝置
    async function startCamera(deviceId) {
        const video = document.getElementById('cam-video');
        
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 640 }, height: { ideal: 480 } } : { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            
            // 確保事件只綁定一次或重新啟動監聽
            video.onplay = () => {
                onVideoPlay();
            };
        } catch (err) {
            console.error('啟動鏡頭失敗:', err);
            alert('無法啟動所選鏡頭，請檢查權限或裝置是否被佔用！');
        }
    }

    function onVideoPlay() {
        const video = document.getElementById('cam-video');
        const canvas = document.getElementById('overlay-canvas');

        // 清除舊的偵測 interval 避免疊加
        if (window.detectionInterval) clearInterval(window.detectionInterval);

        window.detectionInterval = setInterval(async () => {
            if (!faceMatcher || video.paused || video.ended) return;

            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const resizedDetections = faceapi.resizeResults(detections, displaySize);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resizedDetections.forEach(detection => {
                const match = faceMatcher.findBestMatch(detection.descriptor);
                const box = detection.detection.box;

                if (match.label !== 'unknown') {
                    const drawBox = new faceapi.draw.DrawBox(box, { label: `✅ ${match.label}`, boxColor: '#4caf50' });
                    drawBox.draw(canvas);
                    sendTriggerToHub(match.label);
                } else {
                    const drawBox = new faceapi.draw.DrawBox(box, { label: '未登記學生', boxColor: '#f44336' });
                    drawBox.draw(canvas);
                }
            });
        }, 200);  //5 fps
    }

    function sendTriggerToHub(studentId) {
        const now = Date.now();
        if (now - lastSendTime < 3500) return;
        lastSendTime = now;

        const cpId = parseInt(role.replace('cp', ''));

        supabaseChannel.send({
            type: 'broadcast',
            event: 'checkpoint_trigger',
            payload: { student_id: studentId, checkpoint_id: cpId, timestamp: now }
        });

        document.getElementById('status-text').innerText = `🎉 認出學生 [${studentId}]，已發送 [${role.toUpperCase()}] 過點！`;
    }
</script>

</body>
</html>
