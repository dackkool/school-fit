<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>坐前體前屈挑戰 | AI 體適能</title>
    <!-- MediaPipe 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body {
            margin: 0;
            padding: 8px;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 1100px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: row; /* 橫向左右分欄 */
            height: 92vh;
            max-height: 700px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 左側：視像鏡頭區 */
        #video-pane {
            position: relative;
            background-color: #111;
            width: 58%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .input_video { display: none; }
        .output_canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        #body-status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            background-color: #f44336;
            z-index: 10;
        }

        /* 右側：功能操作面板 (Tab 設計) */
        #ui-pane {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            width: 42%;
            height: 100%;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        /* 當進入歷史 Tab 時，鏡頭隱藏，UI 滿版放大 */
        #app-container.full-ui #video-pane {
            display: none !important;
        }
        #app-container.full-ui #ui-pane {
            width: 100% !important;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Tab 導航列 */
        .tab-header {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #ec407a;
            border-bottom: 3.5px solid #ec407a;
        }

        .tab-content { display: none; flex-direction: column; justify-content: space-between; flex: 1; }
        .tab-content.active { display: flex; }

        h1 { color: #ec407a; text-align: center; font-size: 1.3rem; margin: 0 0 2px 0; }
        .subtitle { font-size: 0.75rem; color: #666; text-align: center; margin-bottom: 6px; }
        
        .input-group { margin-bottom: 6px; }
        .input-group label { font-size: 0.85rem; color: #444; font-weight: bold; display: block; margin-bottom: 3px; }
        .input-group input {
            width: 100%;
            padding: 8px 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1.5px solid #ccc;
        }

        #score-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #f1f8e9;
            padding: 8px;
            border-radius: 12px;
            margin: 6px 0;
        }

        #timer { font-size: 1.5rem; color: #ff9800; font-weight: bold; }
        #distance-count { font-size: 2.4rem; color: #4caf50; font-weight: bold; }

        #feedback {
            background-color: #fff9c4;
            padding: 8px 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
            border: 1.5px solid #fff176;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .tips-box {
            font-size: 0.78rem;
            color: #37474f;
            background-color: #e3f2fd;
            padding: 8px;
            border-radius: 8px;
            margin: 4px 0;
            line-height: 1.3;
        }

        /* 歷史頁面擴展樣式 */
        #history-box {
            flex: 1;
            overflow-y: auto;
            min-height: 180px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            background-color: #fafafa;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .trend-card {
            background-color: #fff3e0;
            border: 1px solid #ffe0b2;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #e65100;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        button.action-btn {
            width: 100%;
            padding: 10px;
            font-size: 1.05rem;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background-color: #4caf50;
            margin-top: 4px;
        }
        button.action-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        button.action-btn:hover:not(:disabled) { opacity: 0.9; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 左側：視像鏡頭區 -->
    <div id="video-pane">
        <div id="body-status-badge">❌ 請調整手機，側面全身入鏡</div>
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <!-- 右側：功能操作面板 (Tab 設計) -->
    <div id="ui-pane">
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('challenge')">🤖 AI 體前屈測試</button>
            <button class="tab-btn" onclick="switchTab('history')">📊 過往紀錄與分析</button>
        </div>

        <!-- TAB 1: AI 挑戰區 -->
        <div id="tab-challenge" class="tab-content active">
            <div>
                <h1>坐前體前屈測驗</h1>
                <div class="subtitle">依據香港教育局體適能要求設計</div>
            </div>

            <div class="input-group">
                <label>學生學號：</label>
                <input type="text" id="student-id" placeholder="例如: S001">
            </div>

            <div class="tips-box">
                💡 <b>動作要點：</b>雙腿必須打直（不可曲膝）、緩慢向前伸四次，第四次保持不動至少 1 秒。
            </div>

            <div id="score-board">
                <div>
                    <div style="font-size:0.75rem; color:#666;">測試狀態 / 次數</div>
                    <div id="timer">準備中</div>
                </div>
                <div>
                    <div style="font-size:0.75rem; color:#666;">最佳成績 (cm)</div>
                    <div id="distance-count">0.0</div>
                </div>
            </div>

            <div id="feedback">請退後讓側身鏡頭拍到全身，然後輸入學號。</div>

            <div>
                <button id="start-btn" class="action-btn" disabled>請先對準全身側鏡頭</button>
                <button id="stop-btn" class="action-btn" style="background-color: #f44336; display: none;">結束並上傳最佳成績</button>
            </div>
        </div>

        <!-- TAB 2: 過往紀錄與分析區（進入後自動滿版） -->
        <div id="tab-history" class="tab-content" style="display: none;">
            <div>
                <h1>個人進度與趨勢分析</h1>
                <div class="subtitle">查看過往 10 次柔韌度成績及智能訓練建議</div>
            </div>

            <div class="input-group">
                <label>輸入學號以查詢紀錄：</label>
                <input type="text" id="query-id" placeholder="例如: S001">
            </div>
            <button class="action-btn" onclick="fetchStudentHistory()" style="background-color: #2196f3; padding: 8px; font-size: 0.95rem; margin-bottom: 8px;">🔍 查詢紀錄</button>

            <div id="trend-analysis" class="trend-card">
                📈 <b>趨勢分析：</b>請輸入學號並點擊查詢。
            </div>

            <div id="history-box">
                <div style="text-align: center; color: #888; padding: 20px;">尚無紀錄</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. 請填入你自己的 Supabase 資料 ---
    const SUPABASE_URL = 'https://你的專案ID.supabase.co'; 
    const SUPABASE_ANON_KEY = '你的API_KEY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const distanceDisplay = document.getElementById('distance-count');
    const timerDisplay = document.getElementById('timer');
    const feedbackDisplay = document.getElementById('feedback');
    const studentIdInput = document.getElementById('student-id');
    const bodyStatusBadge = document.getElementById('body-status-badge');
    const appContainer = document.getElementById('app-container');

    let bestDistance = 0.0;
    let reachCount = 0;
    let stage = 'retreat'; // retreat (向後預備), pushing (向前伸), holding (第四次停格)
    let isRunning = false;
    let isFullBodyVisible = false;
    let holdTimer = null;
    let lastWristX = 0;

    // 切換 Tab 時動態隱藏/顯示鏡頭，滿版放大歷史紀錄
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
            content.style.display = 'none';
        });

        if (tabName === 'challenge') {
            appContainer.classList.remove('full-ui'); // 顯示鏡頭
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            const target = document.getElementById('tab-challenge');
            target.classList.add('active');
            target.style.display = 'flex';
        } else {
            appContainer.classList.add('full-ui'); // 隱藏鏡頭，介面擴展滿版
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            const target = document.getElementById('tab-history');
            target.classList.add('active');
            target.style.display = 'flex';
            
            // 自動帶入挑戰區輸入的學號
            if (studentIdInput.value.trim()) {
                document.getElementById('query-id').value = studentIdInput.value.trim();
                fetchStudentHistory();
            }
        }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        synth.cancel();
        synth.speak(utter);
    };

    function calculateAngle(a, b, c) {
        const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        if (angle > 180.0) angle = 360 - angle;
        return angle;
    }

    // 全身檢查邏輯：坐前伸需要側身拍到肩膀、髖、膝、踝、手腕
    function checkFullBody(landmarks) {
        const keyPoints = [11, 12, 23, 24, 25, 26, 27, 28]; 
        return keyPoints.every(idx => landmarks[idx] && landmarks[idx].visibility > 0.45);
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        canvasCtx.scale(-1, 1);
        canvasCtx.translate(-canvasElement.width, 0);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1, radius: 4});

            isFullBodyVisible = checkFullBody(results.poseLandmarks);

            if (!isRunning) {
                if (isFullBodyVisible) {
                    bodyStatusBadge.style.backgroundColor = '#4caf50';
                    bodyStatusBadge.innerText = '✅ 側身就位，可以開始！';
                    startBtn.disabled = false;
                    startBtn.innerText = '開始測驗！';
                    if (feedbackDisplay.innerText.includes('全身')) {
                        feedbackDisplay.innerText = '姿勢正確，請輸入學號並點擊開始。';
                    }
                } else {
                    bodyStatusBadge.style.backgroundColor = '#f44336';
                    bodyStatusBadge.innerText = '❌ 請調整位置，側身全身需入鏡';
                    startBtn.disabled = true;
                    startBtn.innerText = '請先對準側身全身鏡頭';
                }
                canvasCtx.restore();
                return;
            }

            const landmarks = results.poseLandmarks;
            const side = landmarks[12].visibility > landmarks[11].visibility ? 'right' : 'left';
            const hip = side === 'right' ? landmarks[24] : landmarks[23];
            const knee = side === 'right' ? landmarks[26] : landmarks[25];
            const ankle = side === 'right' ? landmarks[28] : landmarks[27];
            const wrist = side === 'right' ? landmarks[16] : landmarks[15];

            // 1. 檢查膝蓋是否打直 (必須大於 165 度)
            const kneeAngle = calculateAngle(hip, knee, ankle);
            if (kneeAngle < 165) {
                feedbackDisplay.innerText = "⚠️ 雙腿必須打直！請勿曲膝！";
                speak("請勿曲膝，把雙腿伸直！");
                return;
            }

            // 2. 模擬計算前伸距離 (以像素差對應大約公分，基準值 23cm)
            // 實際應對齊箱端板，這裡用相對像素換算示範
            const baseRefX = ankle.x; // 以腳踝/箱端為基準
            const rawPixelDist = Math.abs(wrist.x - baseRefX);
            // 假設 10 像素 = 1 公分進行比例縮放 (可依實際相機距離微調係數)
            let currentCM = parseFloat((rawPixelDist * 50 - 15).toFixed(1)); 
            if (currentCM < 0) currentCM = 0.0;

            // 3. 前伸次數與狀態管理 (慢慢前伸四次)
            const wristMovement = Math.abs(wrist.x - lastWristX);
            lastWristX = wrist.x;

            timerDisplay.innerText = `第 ${reachCount + 1} 次前伸`;

            if (currentCM > bestDistance) {
                bestDistance = currentCM;
                distanceDisplay.innerText = bestDistance.toFixed(1);
            }

            // 簡易動作觸發判斷：向前推進後停頓算完成一次
            if (wristMovement < 0.002 && currentCM > 5) {
                // 停止不動中
                if (!holdTimer && reachCount < 4) {
                    holdTimer = setTimeout(() => {
                        reachCount++;
                        speak(`完成第 ${reachCount} 次`);
                        if (reachCount >= 4) {
                            feedbackDisplay.innerText = "🎉 四次前伸完成！已鎖定最佳成績！";
                            speak("四次前伸完成！表現很好！");
                            endChallenge();
                        }
                        holdTimer = null;
                    }, 1000); // 停格 1 秒確認
                }
            } else {
                if (holdTimer) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                feedbackDisplay.innerText = `📏 正在前伸... 目前距離: ${currentCM} cm`;
            }
        }
        canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
    });
    camera.start();

    startBtn.addEventListener('click', () => {
        const studentId = studentIdInput.value.trim();
        if (!studentId) {
            alert('請先輸入學號才可以開始測驗！');
            return;
        }

        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        studentIdInput.disabled = true;
        
        bestDistance = 0.0;
        reachCount = 0;
        distanceDisplay.innerText = '0.0';
        timerDisplay.innerText = '第 1 次前伸';
        isRunning = true;
        
        speak("測驗開始，請緩慢向前伸四次。");
        feedbackDisplay.innerText = "測驗開始！請慢慢向前伸展四次。";
    });

    stopBtn.addEventListener('click', endChallenge);

    async function endChallenge() {
        if (holdTimer) clearTimeout(holdTimer);
        isRunning = false;
        
        const studentId = studentIdInput.value.trim();
        feedbackDisplay.innerText = `正在上傳最佳成績至雲端...`;

        let praise = "";
        if (bestDistance >= 25) praise = "太厲害了！你的柔韌度非常出色！";
        else if (bestDistance >= 15) praise, praise = "做得很好！柔軟度在標準之內！";
        else praise = "完成測驗！多做拉筋伸展可以改善柔軟度喔！";

        speak(`測驗結束！最佳成績 ${bestDistance} 公分。${praise}`);

        try {
            const { data, error } = await supabaseClient
                .from('fitness_records')
                .insert([{ 
                    student_id: studentId, 
                    category: 'sit_and_reach', 
                    score_value: parseFloat(bestDistance) 
                }]);

            if (error) {
                console.error(error);
                feedbackDisplay.innerText = `上傳失敗：${error.message}`;
            } else {
                feedbackDisplay.innerText = `🎉 成績已成功上傳！最佳成績：${bestDistance} cm。`;
            }
        } catch (err) {
            console.error(err);
            feedbackDisplay.innerText = `網絡連線錯誤！`;
        }

        startBtn.style.display = 'block';
        startBtn.innerText = '再次挑戰';
        stopBtn.style.display = 'none';
        studentIdInput.disabled = false;
    }

    // 查詢過往紀錄與趨勢分析
    async function fetchStudentHistory() {
        const queryId = document.getElementById('query-id').value.trim();
        const historyBox = document.getElementById('history-box');
        const trendAnalysis = document.getElementById('trend-analysis');

        if (!queryId) {
            alert('請先輸入學號！');
            return;
        }

        historyBox.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">載入中...</div>';

        try {
            const { data, error } = await supabaseClient
                .from('fitness_records')
                .select('*')
                .eq('student_id', queryId)
                .eq('category', 'sit_and_reach')
                .order('created_at', { ascending: false })
                .limit(10);

            if (error) throw error;

            if (!data || data.length === 0) {
                historyBox.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">找不到此學號的坐前伸紀錄</div>';
                trendAnalysis.innerHTML = '📈 <b>趨勢分析：</b>尚無足夠數據。';
                return;
            }

            let html = '';
            let scores = [];
            data.forEach((row, index) => {
                const date = new Date(row.created_at).toLocaleDateString('zh-HK');
                html += `<div class="history-item"><span>第 ${data.length - index} 次 (${date})</span><strong>${row.score_value} cm</strong></div>`;
                scores.push(row.score_value);
            });
            historyBox.innerHTML = html;

            const latest = scores[0];
            const maxScore = Math.max(...scores);
            let trendText = "";
            let adviceText = "";

            if (scores.length >= 2) {
                const prev = scores[1];
                if (latest > prev) {
                    trendText = "📈 柔韌度進步中！比上次伸得更遠。";
                    adviceText = "💡 <b>訓練建議：</b>拉筋成效顯著，建議保持每天課前伸展的好習慣！";
                } else if (latest === prev) {
                    trendText = "📊 表現平穩，柔軟度維持穩定。";
                    adviceText = "💡 <b>訓練建議：</b>嘗試在伸展時配合深呼吸，呼氣時再輕輕向前推多 1 厘米。";
                } else {
                    trendText = "📉 表現略有波動，可能身體較緊繃。";
                    adviceText = "💡 <b>訓練建議：</b>測試前請先做好腿部後肌與背部的動態熱身。";
                }
            } else {
                trendText = "🎯 這是你的第一次坐前伸記錄！";
                adviceText = "💡 <b>訓練建議：</b>持之以恆進行下肢伸展，對改善體態很有幫助！";
            }

            trendAnalysis.innerHTML = `<b>${trendText}</b><br>個人最高紀錄：<b>${maxScore} cm</b><br>${adviceText}`;

        } catch (err) {
            console.error(err);
            historyBox.innerHTML = '<div style="text-align: center; color: red; padding: 20px;">查詢發生錯誤</div>';
        }
    }
</script>

</body>
</html>
