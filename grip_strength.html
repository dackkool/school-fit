<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 左右手體適能手握力測驗 | Grip Strength Challenge</title>
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <!-- Tesseract.js 用於專屬數位燈 OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 500px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 15px; }
        h1 { color: #ff9800; font-size: 1.3rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #333; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; font-size: 0.9rem; font-weight: bold; color: #777; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #ff9800; border-bottom: 3.5px solid #ff9800; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .user-info-banner { background: #2a2a2a; border: 1px solid #ff9800; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-info-banner span { color: #ff9800; font-weight: bold; }

        .camera-select-group { margin-bottom: 8px; }
        .camera-select-group label { font-size: 0.8rem; color: #4caf50; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #4caf50; background: #2a2a2a; color: white; }

        .video-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; border: 2.5px solid #ff9800; background: #000; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas#output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .roi-guide-box {
            position: absolute;
            top: 30%;
            left: 20%;
            width: 60%;
            height: 35%;
            border: 3px dashed #00e676;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }
        .roi-label { background: rgba(0,230,118,0.9); color: black; font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 0 0 6px 6px; }

        /* AI 視覺除錯黑白預覽小方格 (自動轉正) */
        #debug-canvas { position: absolute; bottom: 5px; right: 5px; width: 110px; height: 65px; border: 2px solid #00e676; background: #000; z-index: 20; }
        .debug-label { position: absolute; bottom: 73px; right: 5px; font-size: 0.6rem; color: #00e676; z-index: 20; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; }

        .hud-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .hud-card { background: #2a2a2a; border-radius: 10px; padding: 6px; text-align: center; border: 1px solid #444; }
        .hud-title { font-size: 0.7rem; color: #aaa; }
        .hud-value { font-size: 1.1rem; font-weight: bold; color: #ff9800; margin-top: 2px; }

        #status-bar { background: rgba(255, 152, 0, 0.15); border: 1px solid #ff9800; color: #ff9800; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }

        button.btn-primary { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #ff9800; margin-top: 5px; }
        button.btn-primary:hover { opacity: 0.9; }

        .action-btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .history-container { background: #2a2a2a; border-radius: 10px; padding: 10px; max-height: 380px; overflow-y: auto; }
        table.history-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.history-table th, table.history-table td { border: 1px solid #444; padding: 6px; text-align: center; }
        table.history-table th { background-color: #333; color: #ff9800; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>AI 左右手手握力測驗</h1>
    <div class="subtitle">自動方向判定・kg 定位・0.5kg 結算・雲端記錄</div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('challenge')">🦾 手握力測驗</button>
        <button class="tab-btn" onclick="switchTab('history')">📋 歷史成績</button>
    </div>

    <!-- TAB 1: 測驗與辨識 -->
    <div id="tab-challenge" class="tab-content active">
        <div class="user-info-banner">
            <div>當前學生：<span id="current-user-label">載入中...</span></div>
            <button onclick="window.location.href='index.html'" style="background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">返回</button>
        </div>

        <div class="camera-select-group">
            <label>選擇相機鏡頭：</label>
            <select id="camera-select" onchange="changeCamera()">
                <option value="">載入鏡頭中...</option>
            </select>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay muted playsinline></video>
            <canvas id="output-canvas"></canvas>
            
            <div class="roi-guide-box"><div class="roi-label">請將螢幕置於此框內 (支援正反倒拿)</div></div>
            
            <!-- AI 智慧方向轉正與黑白預覽小方格 -->
            <div class="debug-label">AI 轉正預覽 (自動依 kg 定位)</div>
            <canvas id="debug-canvas"></canvas>
        </div>

        <div class="hud-panel">
            <div class="hud-card">
                <div class="hud-title">當前測驗手</div>
                <div class="hud-value" id="current-hand-label" style="color: #00e676;">右手 (1/3)</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">即時讀數</div>
                <div class="hud-value" id="current-grip-display">0.0 kg</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">本手最佳</div>
                <div class="hud-value" id="max-grip-display">0.0 kg</div>
            </div>
        </div>

        <div id="status-bar">⏳ 系統啟動中，請將手握器放入綠框內...</div>
        <div id="control-area"></div>
    </div>

    <!-- TAB 2: 歷史記錄 -->
    <div id="tab-history" class="tab-content" style="display: none;">
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: #aaa; font-weight: bold;">歷史記錄：</span>
            <button onclick="loadHistory()" style="background: #333; color: #ff9800; border: 1px solid #ff9800; padding: 4px 10px; border-radius: 6px; cursor: pointer;">🔄 整理</button>
        </div>
        <div class="history-container">
            <table class="history-table">
                <thead><tr><th>日期</th><th>手別</th><th>最佳成績</th></tr></thead>
                <tbody id="history-tbody"><tr><td colspan="3" style="color: #777; padding: 15px;">載入記錄中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://yenaiiwhfqgksuofnrjn.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_umYVSQBbOX8yQgdxL5TlbA_X9CXZKP_'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = 'TEST_USER';
    let pose = null, mediaStream = null, tesseractWorker = null;
    
    let currentHand = 'right', currentAttempt = 1;
    let rightAttempts = [], leftAttempts = [];
    let state = 'WAITING_FOR_TARGET'; 
    
    let maxGripScore = 0.0;
    let latestOcrValue = 0.0;
    let isOcrProcessing = false;
    let isBodyDetected = false;
    let isDeviceDetected = false;
    let countdownTimer = null, testTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('user_id')) currentUserId = urlParams.get('user_id');
        document.getElementById('current-user-label').innerText = currentUserId;

        await startWebcam();
        await initCameraDevices();
        
        initMediaPipePose();
        await initTesseractOCR();
        
        ocrLoop();
        startMainStateMachine();
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });
        const tabs = { 'challenge': 0, 'history': 1 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';
        if (tabName === 'history') loadHistory();
    }

    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            cameraSelect.innerHTML = '';
            devices.filter(d => d.kind === 'videoinput').forEach((device, index) => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.text = device.label || `鏡頭 ${index + 1}`;
                cameraSelect.appendChild(opt);
            });
        } catch (e) {}
    }

    async function startWebcam(deviceId = null) {
        const videoElement = document.getElementById('webcam');
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        } catch (err) {
            document.getElementById('status-bar').innerText = "⚠️ 無法存取相機權限！";
        }
    }

    async function changeCamera() { await startWebcam(document.getElementById('camera-select').value); }

    async function initTesseractOCR() {
        try {
            document.getElementById('status-bar').innerText = "⏳ 正在載入 AI 方向定位與讀數引擎...";
            tesseractWorker = await Tesseract.createWorker('eng');
            // 允許辨識數字、小數點以及 kg 單位來做方向定位
            await tesseractWorker.setParameters({ tessedit_char_whitelist: '0123456789.kgKG' });
            document.getElementById('status-bar').innerText = "✅ AI 引擎就緒，請將手握器螢幕對準綠框";
        } catch (e) {
            console.error("Tesseract 初始化失敗", e);
        }
    }

    function initMediaPipePose() {
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults((results) => {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (results.poseLandmarks) {
                isBodyDetected = true;
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00e676', lineWidth: 2 });
            } else {
                isBodyDetected = false;
            }
            canvasCtx.restore();
        });
        async function poseLoop() {
            if (videoElement.readyState >= 2 && !videoElement.paused) {
                try { await pose.send({ image: videoElement }); } catch (e) {}
            }
            requestAnimationFrame(poseLoop);
        }
        requestAnimationFrame(poseLoop);
    }

    // 🎯 核心：雙向檢測（0度與180度），利用 kg 單位自動轉正後進行黑白預覽與數值解析
    async function scanDeviceLCD(video) {
        if (!tesseractWorker) return 0;
        const sw = video.videoWidth || 640;
        const sh = video.videoHeight || 480;
        
        const sx = sw * 0.2;
        const sy = sh * 0.3;
        const sWidth = sw * 0.6;
        const sHeight = sh * 0.35;

        // 建立原始畫面擷取 Canvas
        const rawCanvas = document.createElement('canvas');
        rawCanvas.width = sWidth;
        rawCanvas.height = sHeight;
        const rawCtx = rawCanvas.getContext('2d');
        rawCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

        // 測試 0 度與 180 度，找出哪個方向含有 "kg" 或是正確的數字結構
        let bestCanvas = null;
        let bestVal = 0;

        const angles = [0, 180]; // 檢查正向與上下倒轉
        
        for (let angle of angles) {
            const testCanvas = document.createElement('canvas');
            testCanvas.width = sWidth;
            testCanvas.height = sHeight;
            const testCtx = testCanvas.getContext('2d');
            
            testCtx.save();
            if (angle === 180) {
                testCtx.translate(sWidth, sHeight);
                testCtx.rotate(Math.PI);
            }
            testCtx.drawImage(rawCanvas, 0, 0);
            testCtx.restore();

            // 轉成黑白二值化以提升 OCR 辨識率
            let imgData = testCtx.getImageData(0, 0, sWidth, sHeight);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
                let color = brightness > 120 ? 255 : 0; 
                data[i] = data[i+1] = data[i+2] = color;
            }
            testCtx.putImageData(imgData, 0, 0);

            try {
                const { data: { text } } = await tesseractWorker.recognize(testCanvas);
                let lowerText = text.toLowerCase();
                let cleanDigits = text.replace(/[^0-9]/g, '');
                
                // 如果這個方向包含 "kg" 或者成功辨識出 2~3 位數字，判定為正確方向！
                if (lowerText.includes('kg') || cleanDigits.length >= 2) {
                    let parsedVal = 0;
                    if (cleanDigits.length === 3) {
                        let d1 = parseInt(cleanDigits[0]); 
                        let d2 = parseInt(cleanDigits[1]); 
                        let d3 = parseInt(cleanDigits[2]); 
                        parsedVal = (d1 * 10) + d2 + (d3 * 0.1);
                    } else if (cleanDigits.length === 2) {
                        let d1 = parseInt(cleanDigits[0]); 
                        let d2 = parseInt(cleanDigits[1]); 
                        parsedVal = d1 + (d2 * 0.1);
                    }

                    if (parsedVal >= 0.5 && parsedVal <= 99.9) {
                        bestVal = Math.round(parsedVal * 2) / 2;
                        bestCanvas = testCanvas; // 記錄這個轉正且成功的黑白畫布
                        break;
                    }
                }
            } catch (e) {}
        }

        // 💡 將成功轉正的黑白畫面即時呈現在右下角小方格中
        if (bestCanvas) {
            const debugCanvas = document.getElementById('debug-canvas');
            const debugCtx = debugCanvas.getContext('2d');
            debugCanvas.width = sWidth;
            debugCanvas.height = sHeight;
            debugCtx.drawImage(bestCanvas, 0, 0);
        }

        return bestVal;
    }

    async function ocrLoop() {
        if (!isOcrProcessing && tesseractWorker) {
            const video = document.getElementById('webcam');
            if (video && video.readyState >= 2) {
                isOcrProcessing = true;
                let val = await scanDeviceLCD(video);
                if (val > 0) latestOcrValue = val;
                isOcrProcessing = false;
            }
        }
        setTimeout(ocrLoop, 400);
    }

    function startMainStateMachine() {
        setInterval(() => {
            if (state === 'WAITING_FOR_TARGET') {
                isDeviceDetected = (latestOcrValue > 0);
                let handName = currentHand === 'right' ? '右手' : '左手';
                document.getElementById('current-hand-label').innerText = `${handName} (${currentAttempt}/3)`;

                if (isBodyDetected && isDeviceDetected) {
                    startCountdown();
                } else {
                    let msg = `⏳ 請準備 (${handName} 第 ${currentAttempt} 次)`;
                    if (!isBodyDetected) msg += " [未偵測上半身]";
                    if (!isDeviceDetected) msg += " [請將螢幕置於綠框內]";
                    document.getElementById('status-bar').innerText = msg;
                }
            }
        }, 500);
    }

    function startCountdown() {
        state = 'COUNTING_DOWN';
        let count = 3;
        let handName = currentHand === 'right' ? '右手' : '左手';
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.3)';
        document.getElementById('status-bar').innerText = `🔥 ${handName}準備！倒數 ${count} 秒...`;
        speak(`${count}`);

        countdownTimer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('status-bar').innerText = `🔥 ${handName}準備！倒數 ${count} 秒...`;
                speak(`${count}`);
            } else {
                clearInterval(countdownTimer);
                beginGripMeasurement();
            }
        }, 1000);
    }

    function beginGripMeasurement() {
        state = 'TESTING';
        maxGripScore = 0.0;
        latestOcrValue = 0.0;
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        
        speak("請全力握緊！");
        document.getElementById('status-bar').style.backgroundColor = 'rgba(0, 230, 118, 0.2)';
        document.getElementById('status-bar').style.borderColor = '#00e676';
        document.getElementById('status-bar').style.color = '#00e676';
        document.getElementById('status-bar').innerText = "💪 測驗中 (5秒)：請持續用力緊握...";

        let timeLeft = 5;
        testTimer = setInterval(() => {
            if (latestOcrValue > 0) {
                document.getElementById('current-grip-display').innerText = `${latestOcrValue} kg`;
                if (latestOcrValue > maxGripScore) {
                    maxGripScore = latestOcrValue;
                    document.getElementById('max-grip-display').innerText = `${maxGripScore} kg`;
                }
            }

            timeLeft--;
            if (timeLeft > 0) speak(`${timeLeft}`);

            if (timeLeft <= 0) {
                clearInterval(testTimer);
                
                if (maxGripScore <= 0) {
                    document.getElementById('status-bar').innerText = "⚠️ 未穩定讀取到數值，請重新放置！";
                    speak("未讀取到數值，請重試。");
                    setTimeout(resetToWaiting, 2500);
                    return;
                }

                if (currentHand === 'right') rightAttempts.push(maxGripScore);
                else leftAttempts.push(maxGripScore);

                state = 'HAND_CONFIRMING';
                speak(`成績，${maxGripScore} 公斤。`);
                showAttemptConfirmUI(maxGripScore);
            }
        }, 1000);
    }

    function showAttemptConfirmUI(score) {
        let handName = currentHand === 'right' ? '右手' : '左手';
        const statusBar = document.getElementById('status-bar');
        statusBar.innerHTML = `🎉 【${handName}】第 ${currentAttempt} 次成績：<b>${score} kg</b>。`;

        const controlArea = document.getElementById('control-area');
        if (currentAttempt < 3) {
            controlArea.innerHTML = `<button class="btn-primary" onclick="nextAttempt()" style="background-color: #2e7d32;">✔️ 進行下一次 (${currentAttempt + 1}/3)</button>`;
        } else {
            let bestScore = Math.max(...(currentHand === 'right' ? rightAttempts : leftAttempts));
            statusBar.innerHTML = `🏆 【${handName}】最佳成績：<b>${bestScore} kg</b>`;
            if (currentHand === 'right') {
                controlArea.innerHTML = `<button class="btn-primary" onclick="switchToLeftHand()" style="background-color: #1976d2;">➡️ 切換至【左手】測驗</button>`;
            } else {
                controlArea.innerHTML = `<button class="btn-primary" onclick="showFinalUploadUI()" style="background-color: #2e7d32;">☁️ 完成！上傳雲端</button>`;
            }
        }
    }

    function nextAttempt() { currentAttempt++; latestOcrValue = 0; resetToWaiting(); }
    function switchToLeftHand() { currentHand = 'left'; currentAttempt = 1; latestOcrValue = 0; resetToWaiting(); }

    function showFinalUploadUI() {
        state = 'ALL_CONFIRMING';
        let bestRight = Math.max(...rightAttempts);
        let bestLeft = Math.max(...leftAttempts);
        document.getElementById('status-bar').innerHTML = `📊 結算：右手 <b>${bestRight} kg</b> | 左手 <b>${bestLeft} kg</b>`;
        document.getElementById('control-area').innerHTML = `
            <div class="action-btn-group">
                <button class="btn-primary" onclick="confirmUploadAll(${bestRight}, ${bestLeft})" style="background-color: #2e7d32; flex: 1;">✔️ 上傳</button>
                <button class="btn-primary" onclick="fullReset()" style="background-color: #d32f2f; flex: 1;">❌ 重測</button>
            </div>`;
    }

    async function confirmUploadAll(bestRight, bestLeft) {
        document.getElementById('status-bar').innerText = "⏳ 上傳中...";
        try {
            await supabaseClient.from('fitness_records').insert([{ student_id: currentUserId, category: 'grip_right', score_value: bestRight, created_at: new Date() }]);
            await supabaseClient.from('fitness_records').insert([{ student_id: currentUserId, category: 'grip_left', score_value: bestLeft, created_at: new Date() }]);
            document.getElementById('status-bar').innerText = "✅ 上傳成功！";
            speak("上傳成功");
            loadHistory();
            setTimeout(fullReset, 2000);
        } catch (err) { alert("上傳失敗！"); fullReset(); }
    }

    function resetToWaiting() {
        latestOcrValue = 0.0;
        document.getElementById('current-grip-display').innerText = '0.0 kg';
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.15)';
        document.getElementById('status-bar').style.borderColor = '#ff9800';
        document.getElementById('status-bar').style.color = '#ff9800';
        let handName = currentHand === 'right' ? '右手' : '左手';
        document.getElementById('status-bar').innerText = `✅ 就緒！請準備【${handName}】第 ${currentAttempt} 次。`;
        document.getElementById('control-area').innerHTML = '';
        state = 'WAITING_FOR_TARGET';
    }

    function fullReset() { currentHand = 'right'; currentAttempt = 1; rightAttempts = []; leftAttempts = []; resetToWaiting(); }

    async function loadHistory() {
        const tbody = document.getElementById('history-tbody');
        try {
            const { data, error } = await supabaseClient.from('fitness_records').select('*').eq('student_id', currentUserId).in('category', ['grip_right', 'grip_left']).order('created_at', { ascending: false }).limit(10);
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="3">尚無記錄</td></tr>`; return; }
            data.forEach(row => {
                let handType = row.category === 'grip_right' ? '🔴 右手' : '🔵 左手';
                tbody.innerHTML += `<tr><td>${new Date(row.created_at).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${handType}</td><td><b style="color: #ff9800;">${row.score_value} kg</b></td></tr>`;
            });
        } catch (err) { tbody.innerHTML = `<tr><td colspan="3" style="color: red;">載入失敗</td></tr>`; }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => { const utter = new SpeechSynthesisUtterance(text); utter.lang = 'zh-HK'; synth.cancel(); synth.speak(utter); };
</script>
</body>
</html>
