<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 左右手體適能手握力測驗 | Grip Strength Challenge</title>
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <!-- Tesseract.js 用於專屬數位燈 OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 500px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 15px; }
        h1 { color: #ff9800; font-size: 1.3rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #333; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; font-size: 0.9rem; font-weight: bold; color: #777; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #ff9800; border-bottom: 3.5px solid #ff9800; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .user-info-banner { background: #2a2a2a; border: 1px solid #ff9800; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-info-banner span { color: #ff9800; font-weight: bold; }

        .camera-select-group { margin-bottom: 8px; }
        .camera-select-group label { font-size: 0.8rem; color: #4caf50; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #4caf50; background: #2a2a2a; color: white; }

        .video-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; border: 2.5px solid #ff9800; background: #000; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; transform: scaleX(-1); }

        .roi-guide-box {
            position: absolute;
            top: 30%;
            left: 20%;
            width: 60%;
            height: 35%;
            border: 3px dashed #00e676;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }
        .roi-label { background: rgba(0,230,118,0.9); color: black; font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 0 0 6px 6px; }

        .hud-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .hud-card { background: #2a2a2a; border-radius: 10px; padding: 6px; text-align: center; border: 1px solid #444; }
        .hud-title { font-size: 0.7rem; color: #aaa; }
        .hud-value { font-size: 1.1rem; font-weight: bold; color: #ff9800; margin-top: 2px; }

        #status-bar { background: rgba(255, 152, 0, 0.15); border: 1px solid #ff9800; color: #ff9800; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }

        button.btn-primary { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #ff9800; margin-top: 5px; }
        button.btn-primary:hover { opacity: 0.9; }

        .action-btn-group { display: flex; gap: 10px; margin-top: 5px; }

        .history-container { background: #2a2a2a; border-radius: 10px; padding: 10px; max-height: 380px; overflow-y: auto; }
        table.history-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.history-table th, table.history-table td { border: 1px solid #444; padding: 6px; text-align: center; }
        table.history-table th { background-color: #333; color: #ff9800; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>AI 左右手手握力測驗</h1>
    <div class="subtitle">左右手分開測試・以 0.5 kg 結算・3秒自動倒數・學界標準</div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('challenge')">🦾 手握力測驗</button>
        <button class="tab-btn" onclick="switchTab('history')">📋 歷史成績</button>
    </div>

    <!-- TAB 1: 測驗與辨識 -->
    <div id="tab-challenge" class="tab-content active">
        <div class="user-info-banner">
            <div>當前學生：<span id="current-user-label">載入中...</span></div>
            <button onclick="window.location.href='index.html'" style="background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">返回主頁</button>
        </div>

        <div class="camera-select-group">
            <label>選擇相機鏡頭：</label>
            <select id="camera-select" onchange="changeCamera()">
                <option value="">載入鏡頭中...</option>
            </select>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay muted playsinline></video>
            <canvas id="output-canvas"></canvas>
            <!-- 螢幕指定對準框 -->
            <div class="roi-guide-box">
                <div class="roi-label">請將手握器螢幕置於此框內</div>
            </div>
        </div>

        <div class="hud-panel">
            <div class="hud-card">
                <div class="hud-title">當前測驗手</div>
                <div class="hud-value" id="current-hand-label" style="color: #00e676;">右手 (1/3)</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">即時讀數</div>
                <div class="hud-value" id="current-grip-display">0.0 kg</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">本手最佳</div>
                <div class="hud-value" id="max-grip-display">0.0 kg</div>
            </div>
        </div>

        <div id="status-bar">⏳ 正在啟動系統，請準備進行【右手】測驗（手垂直，大腿旁）...</div>
        
        <div id="control-area"></div>
    </div>

    <!-- TAB 2: 歷史記錄 -->
    <div id="tab-history" class="tab-content" style="display: none;">
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: #aaa; font-weight: bold;">個人手握力歷史記錄：</span>
            <button onclick="loadHistory()" style="background: #333; color: #ff9800; border: 1px solid #ff9800; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">🔄 重新整理</button>
        </div>
        <div class="history-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>手別</th>
                        <th>最佳成績 (0.5kg)</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr><td colspan="3" style="color: #777; padding: 15px;">載入記錄中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'supa url'; 
    const SUPABASE_ANON_KEY = 'anon key'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let currentUserName = '訪客學生';
    let pose = null;
    let mediaStream = null;
    
    // 測驗流程狀態控制
    let currentHand = 'right'; // 'right' 或 'left'
    let currentAttempt = 1;    // 第 1, 2, 3 次
    let rightAttempts = [];    // 右手三次成績
    let leftAttempts = [];     // 左手三次成績
    let state = 'WAITING_FOR_TARGET'; // WAITING_FOR_TARGET -> COUNTING_DOWN -> TESTING -> HAND_CONFIRMING -> ALL_CONFIRMING
    
    let maxGripScore = 0.0;
    let tesseractWorker = null;
    let isBodyDetected = false;
    let isDeviceDetected = false;
    let countdownTimer = null;
    let testTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        currentUserId = urlParams.get('user_id');

        if (!currentUserId) {
            currentUserId = 'TEST_USER';
            document.getElementById('current-user-label').innerText = `未登入 (預設測試模式)`;
        } else {
            await verifyAndFetchUser(currentUserId);
        }

        await startWebcam();
        await initCameraDevices();
        
        initMediaPipePose();
        initTesseractOCR();
        loadHistory();
    });

    async function verifyAndFetchUser(userId) {
        try {
            const { data, error } = await supabaseClient
                .from('students_db')
                .select('student_id, name')
                .eq('student_id', userId)
                .single();

            if (data) {
                currentUserName = data.name;
                document.getElementById('current-user-label').innerText = `${currentUserName} (${currentUserId})`;
            }
        } catch (e) {
            document.getElementById('current-user-label').innerText = `${userId}`;
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });

        const tabs = { 'challenge': 0, 'history': 1 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';

        if (tabName === 'history') loadHistory();
    }

    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.text = device.label || `鏡頭 ${index + 1}`;
                cameraSelect.appendChild(opt);
            });
        } catch (e) {
            console.error("無法取得鏡頭列表", e);
        }
    }

    async function startWebcam(deviceId = null) {
        const videoElement = document.getElementById('webcam');
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        };

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        } catch (err) {
            console.error("相機啟動失敗:", err);
            document.getElementById('status-bar').innerText = "⚠️ 無法存取相機權限！";
        }
    }

    async function changeCamera() {
        const selectedId = document.getElementById('camera-select').value;
        await startWebcam(selectedId);
    }

    async function initTesseractOCR() {
        try {
            tesseractWorker = await Tesseract.createWorker('eng');
            await tesseractWorker.setParameters({
                tessedit_char_whitelist: '0123456789',
            });
            startMainLoop();
        } catch (e) {
            console.error("Tesseract 初始化失敗", e);
        }
    }

    async function initMediaPipePose() {
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            if (!canvasElement || !canvasCtx) return;
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (results.poseLandmarks) {
                isBodyDetected = true;
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00e676', lineWidth: 2 });
                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#ff9800', lineWidth: 1 });
            } else {
                isBodyDetected = false;
            }
            canvasCtx.restore();
        });

        async function poseLoop() {
            if (videoElement && videoElement.readyState >= 2 && !videoElement.paused && !videoElement.ended) {
                try {
                    await pose.send({ image: videoElement });
                } catch (e) {}
            }
            requestAnimationFrame(poseLoop);
        }
        requestAnimationFrame(poseLoop);
    }

    // 🎯 核心：依據固定位數架構解析數值，並對齊最接近的 0.5 kg
    async function scanDeviceLCD(video) {
        if (!tesseractWorker) return 0;
        const sw = video.videoWidth || 640;
        const sh = video.videoHeight || 480;
        
        const sx = sw * 0.2;
        const sy = sh * 0.3;
        const sWidth = sw * 0.6;
        const sHeight = sh * 0.35;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = sWidth;
        tempCanvas.height = sHeight;
        const ctx = tempCanvas.getContext('2d');
        ctx.translate(sWidth, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

        try {
            const { data: { text } } = await tesseractWorker.recognize(tempCanvas);
            let rawDigits = text.replace(/[^0-9]/g, '');
            
            if (rawDigits.length >= 2) {
                let parsedVal = 0;
                if (rawDigits.length === 3) {
                    let d1 = parseInt(rawDigits[0]); 
                    let d2 = parseInt(rawDigits[1]); 
                    let d3 = parseInt(rawDigits[2]); 
                    parsedVal = (d1 * 10) + d2 + (d3 * 0.1);
                } else if (rawDigits.length === 2) {
                    let d1 = parseInt(rawDigits[0]); 
                    let d2 = parseInt(rawDigits[1]); 
                    parsedVal = d1 + (d2 * 0.1);
                }

                if (parsedVal >= 0.5 && parsedVal <= 99.9) {
                    // 💡 對齊最接近的 1/2 千克 (0.5 kg)
                    let roundedHalfKg = Math.round(parsedVal * 2) / 2;
                    return roundedHalfKg;
                }
            }
            return 0;
        } catch (err) {
            return 0;
        }
    }

    function startMainLoop() {
        setInterval(async () => {
            const video = document.getElementById('webcam');
            if (!video || video.paused || video.ended || video.readyState < 2) return;

            if (state === 'WAITING_FOR_TARGET') {
                let currentVal = await scanDeviceLCD(video);
                isDeviceDetected = (currentVal > 0);

                let handName = currentHand === 'right' ? '右手' : '左手';
                document.getElementById('current-hand-label</u>').innerText = `${handName} (${currentAttempt}/3)`;

                if (isBodyDetected && isDeviceDetected) {
                    startCountdown();
                } else {
                    let msg = `⏳ 請將上半身入鏡 (${handName} 第 ${currentAttempt} 次)`;
                    if (!isBodyDetected) msg += " [未偵測到人體]";
                    if (!isDeviceDetected) msg += " [未置於綠框內]";
                    document.getElementById('status-bar').innerText = msg;
                }
            }
        }, 800);
    }

    function startCountdown() {
        state = 'COUNTING_DOWN';
        let count = 3;
        let handName = currentHand === 'right' ? '右手' : '左手';
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.3)';
        document.getElementById('status-bar').innerText = `🔥 ${handName}第${currentAttempt}次就緒！倒數 ${count} 秒...`;
        speak(`${count}`);

        countdownTimer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('status-bar').innerText = `🔥 ${handName}第${currentAttempt}次就緒！倒數 ${count} 秒...`;
                speak(`${count}`);
            } else {
                clearInterval(countdownTimer);
                beginGripMeasurement();
            }
        }, 1000);
    }

    function beginGripMeasurement() {
        state = 'TESTING';
        maxGripScore = 0.0;
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        
        speak("請全力握緊！");
        document.getElementById('status-bar').style.backgroundColor = 'rgba(0, 230, 118, 0.2)';
        document.getElementById('status-bar').style.borderColor = '#00e676';
        document.getElementById('status-bar').style.color = '#00e676';
        document.getElementById('status-bar').innerText = "💪 測驗中 (5秒)：請持續用力緊握...";

        let timeLeft = 5;
        testTimer = setInterval(async () => {
            const video = document.getElementById('webcam');
            if (video && video.readyState >= 2) {
                let val = await scanDeviceLCD(video);
                if (val > 0) {
                    document.getElementById('current-grip-display').innerText = `${val} kg`;
                    if (val > maxGripScore) {
                        maxGripScore = val;
                        document.getElementById('max-grip-display').innerText = `${maxGripScore} kg`;
                    }
                }
            }

            timeLeft--;
            if (timeLeft > 0) {
                speak(`${timeLeft}`);
            }

            if (timeLeft <= 0) {
                clearInterval(testTimer);
                
                if (maxGripScore <= 0) {
                    document.getElementById('status-bar').innerText = "⚠️ 未穩定讀取到數值，請重新放置！";
                    speak("未讀取到數值，請重新測驗。");
                    setTimeout(resetToWaiting, 2500);
                    return;
                }

                // 儲存當次成績
                if (currentHand === 'right') {
                    rightAttempts.push(maxGripScore);
                } else {
                    leftAttempts.push(maxGripScore);
                }

                state = 'HAND_CONFIRMING';
                speak(`第 ${currentAttempt} 次成績，${maxGripScore} 公斤。`);
                showAttemptConfirmUI(maxGripScore);
            }
        }, 1000);
    }

    function showAttemptConfirmUI(score) {
        let handName = currentHand === 'right' ? '右手' : '左手';
        const statusBar = document.getElementById('status-bar');
        statusBar.innerHTML = `🎉 【${handName}】第 ${currentAttempt} 次成績：<b>${score} kg</b>。`;

        const controlArea = document.getElementById('control-area');
        if (currentAttempt < 3) {
            controlArea.innerHTML = `
                <button class="btn-primary" onclick="nextAttempt()" style="background-color: #2e7d32;">✔️ 記錄並進行下一次測驗 (${currentAttempt + 1}/3)</button>
            `;
        } else {
            // 三次測驗完成，計算該手最佳成績
            let bestScore = Math.max(...(currentHand === 'right' ? rightAttempts : leftAttempts));
            statusBar.innerHTML = `🏆 【${handName}】三次測驗完成！最佳成績：<b>${bestScore} kg</b>`;
            
            if (currentHand === 'right') {
                controlArea.innerHTML = `
                    <button class="btn-primary" onclick="switchToLeftHand()" style="background-color: #1976d2;">➡️ 確認右手成績，切換至【左手】測驗</button>
                `;
            } else {
                controlArea.innerHTML = `
                    <button class="btn-primary" onclick="showFinalUploadUI()" style="background-color: #2e7d32;">☁️ 左右手皆完成！前往確認上傳雲端</button>
                `;
            }
        }
    }

    function nextAttempt() {
        currentAttempt++;
        resetToWaiting();
    }

    function switchToLeftHand() {
        currentHand = 'left';
        currentAttempt = 1;
        document.getElementById('current-hand-label').innerText = `左手 (1/3)`;
        resetToWaiting();
    }

    function showFinalUploadUI() {
        state = 'ALL_CONFIRMING';
        let bestRight = rightAttempts.length > 0 ? Math.max(...rightAttempts) : 0;
        let bestLeft = leftAttempts.length > 0 ? Math.max(...leftAttempts) : 0;

        const statusBar = document.getElementById('status-bar');
        statusBar.innerHTML = `📊 測驗結算：<br>👉 右手最佳：<b>${bestRight} kg</b> | 👉 左手最佳：<b>${bestLeft} kg</b><br>是否確定上傳至雲端？`;

        const controlArea = document.getElementById('control-area');
        controlArea.innerHTML = `
            <div class="action-btn-group">
                <button class="btn-primary" onclick="confirmUploadAll(${bestRight}, ${bestLeft})" style="background-color: #2e7d32; flex: 1;">✔️ 確定上傳雲端</button>
                <button class="btn-primary" onclick="fullReset()" style="background-color: #d32f2f; flex: 1;">❌ 重新測驗</button>
            </div>
        `;
    }

    async function confirmUploadAll(bestRight, bestLeft) {
        document.getElementById('status-bar').innerText = "⏳ 正在上傳左右手成績至雲端...";
        try {
            // 分別上傳右手與左手成績
            const { error: errR } = await supabaseClient.from('fitness_records').insert([
                { student_id: currentUserId, category: 'grip_right', score_value: bestRight, created_at: new Date() }
            ]);
            if (errR) throw errR;

            const { error: errL } = await supabaseClient.from('fitness_records').insert([
                { student_id: currentUserId, category: 'grip_left', score_value: bestLeft, created_at: new Date() }
            ]);
            if (errL) throw errL;
            
            document.getElementById('status-bar').innerText = "✅ 左右手成績已成功上傳至雲端！";
            speak("左右手成績上傳成功");
            loadHistory();
            fullReset();
        } catch (err) {
            console.error("成績上傳失敗", err);
            alert("成績上傳雲端失敗，請檢查資料表結構！");
            fullReset();
        }
    }

    function resetToWaiting() {
        maxGripScore = 0.0;
        document.getElementById('current-grip-display').innerText = '0.0 kg';
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.15)';
        document.getElementById('status-bar').style.borderColor = '#ff9800';
        document.getElementById('status-bar').style.color = '#ff9800';
        let handName = currentHand === 'right' ? '右手' : '左手';
        document.getElementById('status-bar').innerText = `✅ 準備就緒！請準備進行【${handName}】第 ${currentAttempt} 次測驗。`;
        document.getElementById('control-area').innerHTML = '';
        state = 'WAITING_FOR_TARGET';
    }

    function fullReset() {
        currentHand = 'right';
        currentAttempt = 1;
        rightAttempts = [];
        leftAttempts = [];
        document.getElementById('current-hand-label').innerText = `右手 (1/3)`;
        resetToWaiting();
    }

    async function loadHistory() {
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = `<tr><td colspan="3" style="color: #ff9800; padding: 15px;">載入記錄中...</td></tr>`;

        try {
            const { data, error } = await supabaseClient
                .from('fitness_records')
                .select('*')
                .eq('student_id', currentUserId)
                .in('category', ['grip_right', 'grip_left'])
                .order('created_at', { ascending: false })
                .limit(30);

            if (error) throw error;

            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: #777; padding: 15px;">尚無個人手握力記錄</td></tr>`;
                return;
            }

            data.forEach(row => {
                const dateStr = new Date(row.created_at).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                let handType = row.category === 'grip_right' ? '🔴 右手' : '🔵 左手';
                tbody.innerHTML += `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${handType}</td>
                        <td><b style="color: #ff9800;">${row.score_value} kg</b></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("載入歷史記錄失敗:", err);
            tbody.innerHTML = `<tr><td colspan="3" style="color: #f44336; padding: 15px;">載入出錯：請確認 Supabase 已建立 <b>fitness_records</b> 表。</td></tr>`;
        }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        synth.cancel();
        synth.speak(utter);
    };
</script>

</body>
</html>
