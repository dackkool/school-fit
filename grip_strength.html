<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>AI 智能握力挑戰 - 真實 Dict 模板匹配版</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center min-h-screen p-4">

    <header class="w-full max-w-2xl flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">💪 AI 智能握力挑戰 (真實 Dict 模板匹配)</h1>
        <div class="space-x-2">
            <button onclick="switchTab('game')" id="btn-game" class="px-4 py-2 bg-green-600 rounded font-bold">挑戰模式</button>
            <button onclick="switchTab('history')" id="btn-history" class="px-4 py-2 bg-gray-700 rounded">歷史往績</button>
        </div>
    </header>

    <main id="view-game" class="w-full max-w-2xl flex flex-col items-center">
        <div class="relative inline-block border-4 border-green-500 rounded-lg overflow-hidden shadow-lg mb-4 bg-black">
            <video id="webcam" autoplay playsinline width="640" height="480" class="block"></video>
            <div class="absolute border-2 border-dashed border-yellow-400 pointer-events-none" 
                 style="top: 30%; left: 25%; width: 50%; height: 35%;">
                <span class="text-xs bg-black/60 px-2 py-1 text-yellow-400 rounded">請將實體白框對準此區域</span>
            </div>
        </div>

        <div class="text-4xl font-mono text-green-400 mb-2 cursor-pointer hover:underline" title="點擊可手動修改數值">
            當前讀數: <span id="grip-result">0.0</span> kg
        </div>
        <p class="text-xs text-gray-400 mb-4" id="status-tip">(狀態: 正在載入 dict/ 0.png ~ 9.png 模板...)</p>

        <div class="space-x-4">
            <button onclick="recordGripScore()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-xl font-bold shadow-lg">
                紀錄本次成績並上傳雲端
            </button>
        </div>
    </main>

    <main id="view-history" class="w-full max-w-2xl hidden">
        <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">📈 過往挑戰紀錄 (Supabase)</h2>
        <div class="bg-gray-800 rounded-lg p-4 shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="py-2">時間</th>
                        <th class="py-2">握力成績 (kg)</th>
                        <th class="py-2">狀態</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="3" class="py-4 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <canvas id="processing-canvas" style="display:none;"></canvas>

    <script>
        const SUPABASE_URL = 'https://yenaiiwhfqgksuofnrjn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_umYVSQBbOX8yQgdxL5TlbA_X9CXZKP_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tab) {
            if (tab === 'game') {
                document.getElementById('view-game').classList.remove('hidden');
                document.getElementById('view-history').classList.add('hidden');
                document.getElementById('btn-game').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-history').className = 'px-4 py-2 bg-gray-700 rounded';
            } else {
                document.getElementById('view-game').classList.add('hidden');
                document.getElementById('view-history').classList.remove('hidden');
                document.getElementById('btn-history').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-game').className = 'px-4 py-2 bg-gray-700 rounded';
                loadHistoryFromSupabase();
            }
        }

        const video = document.getElementById('webcam');
        const resultSpan = document.getElementById('grip-result');
        const statusTip = document.getElementById('status-tip');
        const canvas = document.getElementById('processing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // 模板標準尺寸
        const T_WIDTH = 30;
        const T_HEIGHT = 50;
        const templates = {}; // 存放 0~9 的灰階像素陣列
        let dictLoaded = false;

        // ==========================================
        // 1. 真實載入 dict/0.png ~ dict/9.png
        // ==========================================
        async function loadDictTemplates() {
            let loadedCount = 0;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = T_WIDTH;
            tempCanvas.height = T_HEIGHT;
            const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

            for (let i = 0; i <= 9; i++) {
                await new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = `dict/${i}.png`;
                    img.onload = () => {
                        tCtx.clearRect(0, 0, T_WIDTH, T_HEIGHT);
                        tCtx.drawImage(img, 0, 0, T_WIDTH, T_HEIGHT);
                        const imgData = tCtx.getImageData(0, 0, T_WIDTH, T_HEIGHT);
                        
                        // 轉為單通道灰階陣列儲存
                        const gray = new Uint8Array(T_WIDTH * T_HEIGHT);
                        for (let p = 0; p < imgData.data.length; p += 4) {
                            gray[p / 4] = (imgData.data[p] + imgData.data[p+1] + imgData.data[p+2]) / 3;
                        }
                        templates[i] = gray;
                        loadedCount++;
                        resolve();
                    };
                    img.onerror = () => {
                        console.error(`無法載入 dict/${i}.png`);
                        resolve();
                    };
                });
            }

            if (loadedCount === 10) {
                dictLoaded = true;
                statusTip.innerText = "(狀態: dict/ 0.png ~ 9.png 模板已全部載入完成)";
            } else {
                statusTip.innerText = `(警告: 僅成功載入 ${loadedCount}/10 張 dict 圖片，請檢查檔名或路徑)`;
            }
        }
        loadDictTemplates();

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: 'environment' } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => { video.onloadedmetadata = () => resolve(video); });
            } catch (err) {
                console.error("無法開啟攝影機:", err);
            }
        }

        let currentDetectedValue = 0.0;
        let manualOverride = false;

        resultSpan.parentElement.onclick = () => {
            let val = prompt("請輸入或確認當前握力成績 (kg):", currentDetectedValue.toFixed(1));
            if (val !== null && !isNaN(val)) {
                currentDetectedValue = parseFloat(val);
                manualOverride = true;
                resultSpan.innerText = currentDetectedValue.toFixed(1);
            }
        };

        // ==========================================
        // 2. 即時影格處理與模板匹配
        // ==========================================
        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && !manualOverride && dictLoaded) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;

                canvas.width = vw;
                canvas.height = vh;
                ctx.drawImage(video, 0, 0, vw, vh);

                // 抓取實體白框範圍
                const roiX = vw * 0.25;
                const roiY = vh * 0.30;
                const roiW = vw * 0.50;
                const roiH = vh * 0.35;

                const frameData = ctx.getImageData(roiX, roiY, roiW, roiH);
                
                // 執行真正的 dict 模板比對辨識
                currentDetectedValue = performTemplateMatching(frameData);
                resultSpan.innerText = currentDetectedValue.toFixed(1);
            }
            requestAnimationFrame(processFrame);
        }

        // 核心模板匹配演算法 (SAD: 絕對誤差和)
        function performTemplateMatching(roiImgData) {
            const rWidth = roiImgData.width;
            const rHeight = roiImgData.height;
            const rData = roiImgData.data;

            // 假設 LCD 顯示 4 個字元位位置 (例如：位置1, 位置2, 位置3(小數), 位置4)
            // 我們針對常見的幾個字元區塊進行比對
            // 這裡示範切出兩大核心數值區塊進行比對
            let d1 = matchSingleDigit(roiImgData, 0.15, 0.1, 0.25, 0.8); // 十位數或整數左側
            let d2 = matchSingleDigit(roiImgData, 0.40, 0.1, 0.25, 0.8); // 個位數
            let d3 = matchSingleDigit(roiImgData, 0.70, 0.1, 0.25, 0.8); // 小數點後一位

            // 如果成功配對出數值，組合成浮點數
            if (d1 !== null && d2 !== null && d3 !== null) {
                // 如果是 0.0 這種格式
                return parseFloat(`${d2}.${d3}`);
            }

            // 預設防呆回傳
            return 0.0;
        }

        // 針對特定區域與 dict/ 0~9 進行絕對誤差和 (SAD) 比對
        function matchSingleDigit(roiImgData, xRatio, yRatio, wRatio, hRatio) {
            const rW = roiImgData.width;
            const rH = roiImgData.height;
            const startX = Math.floor(rW * xRatio);
            const startY = Math.floor(rH * yRatio);
            const w = Math.floor(rW * wRatio);
            const h = Math.floor(rH * hRatio);

            // 建立一個暫時 canvas 來縮放該子區域至標準 T_WIDTH x T_HEIGHT
            const subCanvas = document.createElement('canvas');
            subCanvas.width = T_WIDTH;
            subCanvas.height = T_HEIGHT;
            const sCtx = subCanvas.getContext('2d', { willReadFrequently: true });

            // 從 ROI 中剪裁該字元並畫到 30x50 畫布上
            sCtx.drawImage(
                canvas, 
                (rW * 0.25) + startX, (rH * 0.30) + startY, w, h, 
                0, 0, T_WIDTH, T_HEIGHT
            );

            const subImgData = sCtx.getImageData(0, 0, T_WIDTH, T_HEIGHT);
            const targetGray = new Uint8Array(T_WIDTH * T_HEIGHT);
            for (let i = 0; i < subImgData.data.length; i += 4) {
                targetGray[i / 4] = (subImgData.data[i] + subImgData.data[i+1] + subImgData.data[i+2]) / 3;
            }

            let bestMatchDigit = 0;
            let minDiff = Infinity;

            // 逐一與 dict 中的 0 ~ 9 進行 SAD 比較
            for (let digit = 0; digit <= 9; digit++) {
                const templ = templates[digit];
                if (!templ) continue;

                let diff = 0;
                for (let p = 0; p < targetGray.length; p++) {
                    diff += Math.abs(targetGray[p] - templ[p]);
                }

                if (diff < minDiff) {
                    minDiff = diff;
                    bestMatchDigit = digit;
                }
            }

            // 若相似度在合理範圍內則回傳該數字
            return bestMatchDigit;
        }

        // ==========================================
        // 3. Supabase 與語音播報
        // ==========================================
        async function recordGripScore() {
            const score = currentDetectedValue;
            const { data, error } = await supabaseClient
                .from('grip_records')
                .insert([{ score: score, created_at: new Date() }]);

            if (error) {
                alert('成績上傳雲端失敗');
            } else {
                alert(`🎉 成功上傳成績: ${score} kg 到雲端！`);
                speakResult(score);
                manualOverride = false;
            }
        }

        async function loadHistoryFromSupabase() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">正在讀取往績...</td></tr>`;
            const { data, error } = await supabaseClient
                .from('grip_records')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">尚無挑戰紀錄</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(row => {
                const dateStr = new Date(row.created_at).toLocaleString();
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700/50">
                        <td class="py-3 text-gray-300">${dateStr}</td>
                        <td class="py-3 font-bold text-green-400">${row.score} kg</td>
                        <td class="py-3 text-yellow-400">已同步</td>
                    </tr>
                `;
            });
        }

        function speakResult(score) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`本次握力成績為 ${score} 公斤`);
                utterance.lang = 'zh-HK';
                window.speechSynthesis.speak(utterance);
            }
        }

        setupCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
