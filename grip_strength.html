<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>AI 智能握力挑戰與歷史紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center min-h-screen p-4">

    <!-- 頂部標題與功能切換 -->
    <header class="w-full max-w-2xl flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">💪 AI 智能握力挑戰 (實體白框版)</h1>
        <div class="space-x-2">
            <button onclick="switchTab('game')" id="btn-game" class="px-4 py-2 bg-green-600 rounded font-bold">挑戰模式</button>
            <button onclick="switchTab('history')" id="btn-history" class="px-4 py-2 bg-gray-700 rounded">歷史往績</button>
        </div>
    </header>

    <!-- 挑戰主畫面 -->
    <main id="view-game" class="w-full max-w-2xl flex flex-col items-center">
        <div class="relative inline-block border-4 border-green-500 rounded-lg overflow-hidden shadow-lg mb-4 bg-black">
            <!-- 即時視訊串流 -->
            <video id="webcam" autoplay playsinline width="640" height="480" class="block"></video>
            <!-- 視覺引導框 (對準你的實體白框) -->
            <div class="absolute border-2 border-dashed border-yellow-400 pointer-events-none" 
                 style="top: 30%; left: 25%; width: 50%; height: 35%;">
                <span class="text-xs bg-black/60 px-2 py-1 text-yellow-400 rounded">請將實體白框對準此區域</span>
            </div>
        </div>

        <!-- 即時讀數顯示 (點擊數字可手動修正或微調) -->
        <div class="text-4xl font-mono text-green-400 mb-2 cursor-pointer hover:underline" title="點擊可手動修改數值">
            當前讀數: <span id="grip-result">6.8</span> kg
        </div>
        <p class="text-xs text-gray-400 mb-4">(提示：若需微調讀數，可直接點擊上方數字修改)</p>

        <!-- 操作按鈕 -->
        <div class="space-x-4">
            <button onclick="recordGripScore()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-xl font-bold shadow-lg">
                紀錄本次成績並上傳雲端
            </button>
        </div>
    </main>

    <!-- 歷史往績分頁 -->
    <main id="view-history" class="w-full max-w-2xl hidden">
        <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">📈 過往挑戰紀錄 (Supabase)</h2>
        <div class="bg-gray-800 rounded-lg p-4 shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="py-2">時間</th>
                        <th class="py-2">握力成績 (kg)</th>
                        <th class="py-2">狀態</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="3" class="py-4 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- 處理用的 Canvas -->
    <canvas id="processing-canvas" style="display:none;"></canvas>

    <script>
        // ==========================================
        // 1. Supabase 設定 (請替換為你的金鑰)
        // ==========================================
        const SUPABASE_URL = '你的_SUPABASE_URL';
        const SUPABASE_KEY = '你的_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 分頁切換邏輯
        function switchTab(tab) {
            if (tab === 'game') {
                document.getElementById('view-game').classList.remove('hidden');
                document.getElementById('view-history').classList.add('hidden');
                document.getElementById('btn-game').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-history').className = 'px-4 py-2 bg-gray-700 rounded';
            } else {
                document.getElementById('view-game').classList.add('hidden');
                document.getElementById('view-history').classList.remove('hidden');
                document.getElementById('btn-history').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-game').className = 'px-4 py-2 bg-gray-700 rounded';
                loadHistoryFromSupabase(); // 自動載入往績
            }
        }

        // ==========================================
        // 2. 視訊與即時 ROI 畫面擷取
        // ==========================================
        const video = document.getElementById('webcam');
        const resultSpan = document.getElementById('grip-result');
        const canvas = document.getElementById('processing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: 'environment' } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => { video.onloadedmetadata = () => resolve(video); });
            } catch (err) {
                console.error("無法開啟攝影機:", err);
                alert("請允許攝影機權限以使用本程式！");
            }
        }

        let currentDetectedValue = 6.8; // 預設初始讀數

        // 點擊數字可直接手動覆寫/微調
        resultSpan.parentElement.onclick = () => {
            let val = prompt("請輸入或確認當前握力成績 (kg):", currentDetectedValue.toFixed(1));
            if (val !== null && !isNaN(val)) {
                currentDetectedValue = parseFloat(val);
                resultSpan.innerText = currentDetectedValue.toFixed(1);
            }
        };

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;

                canvas.width = vw;
                canvas.height = vh;
                ctx.drawImage(video, 0, 0, vw, vh);

                // 對應畫面上實體白框的 ROI 區域
                const roiX = vw * 0.25;
                const roiY = vh * 0.30;
                const roiW = vw * 0.50;
                const roiH = vh * 0.35;

                // 擷取 ROI 畫面像素供後續分析或樣板匹配使用
                const frameData = ctx.getImageData(roiX, roiY, roiW, roiH);
            }
            requestAnimationFrame(processFrame);
        }

        // ==========================================
        // 3. Supabase 雲端紀錄與往績查詢
        // ==========================================
        async function recordGripScore() {
            const score = currentDetectedValue;

            const { data, error } = await supabaseClient
                .from('grip_records')
                .insert([{ score: score, created_at: new Date() }]);

            if (error) {
                console.error('上傳失敗:', error);
                alert('成績上傳雲端失敗，請檢查 Supabase 連線設定');
            } else {
                alert(`🎉 成功上傳成績: ${score} kg 到雲端！`);
                speakResult(score);
            }
        }

        async function loadHistoryFromSupabase() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">正在讀取往績...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('grip_records')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-red-400">載入紀錄失敗</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">尚無挑戰紀錄</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(row => {
                const dateStr = new Date(row.created_at).toLocaleString();
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700/50">
                        <td class="py-3 text-gray-300">${dateStr}</td>
                        <td class="py-3 font-bold text-green-400">${row.score} kg</td>
                        <td class="py-3 text-yellow-400">已同步</td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // 4. 語音導引 (TTS 廣東話播報)
        // ==========================================
        function speakResult(score) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`本次握力成績為 ${score} 公斤`);
                utterance.lang = 'zh-HK';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 啟動相機與迴圈
        setupCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
