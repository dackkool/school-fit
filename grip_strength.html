<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 左右手手握力測驗 | YOLOv8 智能辨識</title>
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ONNX Runtime Web for YOLO -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 500px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 15px; }
        h1 { color: #ff9800; font-size: 1.3rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #333; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; font-size: 0.9rem; font-weight: bold; color: #777; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #ff9800; border-bottom: 3.5px solid #ff9800; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .user-info-banner { background: #2a2a2a; border: 1px solid #ff9800; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-info-banner span { color: #ff9800; font-weight: bold; }

        .camera-select-group { margin-bottom: 8px; }
        .camera-select-group label { font-size: 0.8rem; color: #4caf50; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #4caf50; background: #2a2a2a; color: white; }

        .video-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; border: 2.5px solid #ff9800; background: #000; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas#output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .roi-guide-box {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 70%;
            height: 55%;
            border: 3px dashed #00e676;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }
        .roi-label { background: rgba(0,230,118,0.9); color: black; font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 0 0 6px 6px; }

        .hud-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .hud-card { background: #2a2a2a; border-radius: 10px; padding: 6px; text-align: center; border: 1px solid #444; }
        .hud-title { font-size: 0.7rem; color: #aaa; }
        .hud-value { font-size: 1.1rem; font-weight: bold; color: #ff9800; margin-top: 2px; }

        #status-bar { background: rgba(255, 152, 0, 0.15); border: 1px solid #ff9800; color: #ff9800; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }

        button.btn-primary { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #ff9800; margin-top: 5px; }
        button.btn-primary:hover { opacity: 0.9; }
        button.btn-secondary { width: 100%; padding: 10px; font-size: 0.95rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: white; background-color: #00e676; margin-top: 5px; }

        .history-container { background: #2a2a2a; border-radius: 10px; padding: 10px; max-height: 380px; overflow-y: auto; }
        table.history-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.history-table th, table.history-table td { border: 1px solid #444; padding: 6px; text-align: center; }
        table.history-table th { background-color: #333; color: #ff9800; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>AI 左右手手握力測驗</h1>
    <div class="subtitle">YOLOv8 AI 智慧物件偵測・0.5kg 結算</div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('challenge')">🦾 手握力測驗</button>
        <button class="tab-btn" onclick="switchTab('history')">📋 歷史成績</button>
    </div>

    <!-- TAB 1: 測驗與辨識 -->
    <div id="tab-challenge" class="tab-content active">
        <div class="user-info-banner">
            <div>當前學生：<span id="current-user-label">載入中...</span></div>
            <button onclick="window.location.href='index.html'" style="background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">返回</button>
        </div>

        <div class="camera-select-group">
            <label>選擇相機鏡頭：</label>
            <select id="camera-select" onchange="changeCamera()">
                <option value="">載入鏡頭中...</option>
            </select>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay muted playsinline></video>
            <canvas id="output-canvas"></canvas>
            
            <div class="roi-guide-box"><div class="roi-label">請將螢幕數字對準此綠框內</div></div>
        </div>

        <div class="hud-panel">
            <div class="hud-card">
                <div class="hud-title">當前測驗手</div>
                <div class="hud-value" id="current-hand-label" style="color: #00e676;">右手 (第1次)</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">即時讀數</div>
                <div class="hud-value" id="current-grip-display">0.0 kg</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">本手最佳</div>
                <div class="hud-value" id="max-grip-display">0.0 kg</div>
            </div>
        </div>

        <div id="status-bar">⏳ 正在初始化系統與載入 YOLO 模型...</div>
        <div id="control-area"></div>
    </div>

    <!-- TAB 2: 歷史記錄 -->
    <div id="tab-history" class="tab-content" style="display: none;">
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: #aaa; font-weight: bold;">歷史記錄：</span>
            <button onclick="loadHistory()" style="background: #333; color: #ff9800; border: 1px solid #ff9800; padding: 4px 10px; border-radius: 6px; cursor: pointer;">🔄 重新整理</button>
        </div>
        <div class="history-container">
            <table class="history-table">
                <thead><tr><th>日期</th><th>手別</th><th>最佳成績</th></tr></thead>
                <tbody id="history-tbody"><tr><td colspan="3" style="color: #777; padding: 15px;">載入記錄中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = '你的supabase_url'; 
    const SUPABASE_ANON_KEY = '你的supabase_anon_key'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = 'TEST_USER';
    let pose = null, mediaStream = null;
    let yoloSession = null;
    
    let currentHand = 'right';
    let currentAttempt = 1;
    let rightAttempts = [];
    let leftAttempts = [];
    let state = 'IDLE';
    
    let maxGripScore = 0.0;
    let latestOcrValue = 0.0;
    let isProcessing = false;
    let countdownTimer = null, testTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('user_id')) currentUserId = urlParams.get('user_id');
        document.getElementById('current-user-label').innerText = currentUserId;

        await startWebcam();
        await initCameraDevices();
        initMediaPipePose();
        
        await loadYoloModel();
        matchLoop();
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });
        const tabs = { 'challenge': 0, 'history': 1 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';
        if (tabName === 'history') loadHistory();
    }

    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            cameraSelect.innerHTML = '';
            devices.filter(d => d.kind === 'videoinput').forEach((device, index) => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.text = device.label || `鏡頭 ${index + 1}`;
                cameraSelect.appendChild(opt);
            });
        } catch (e) {}
    }

    async function startWebcam(deviceId = null) {
        const videoElement = document.getElementById('webcam');
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            videoElement.srcObject = mediaStream;
            await videoElement.play();
        } catch (err) {
            document.getElementById('status-bar').innerText = "⚠️ 無法存取相機權限！請確認使用 Live Server 運行。";
        }
    }

    async function changeCamera() { await startWebcam(document.getElementById('camera-select').value); }

    async function loadYoloModel() {
        try {
            document.getElementById('status-bar').innerText = "⏳ 正在載入 YOLOv8 AI 模型 (models/best.onnx)...";
            // 載入放在 models/ 資料夾下的 ONNX 模型
            yoloSession = await ort.InferenceSession.create('models/best.onnx', { executionProviders: ['wasm'] });
            document.getElementById('status-bar').innerText = "✅ YOLO 模型載入成功！點擊下方按鈕開始";
            showStartButton("🚀 開始右手第 1 次測驗");
            speak("系統就緒，請準備進行右手測驗");
        } catch (e) {
            console.error("YOLO 載入失敗:", e);
            document.getElementById('status-bar').innerText = "⚠️ 無法載入 models/best.onnx 模型！請確認檔案路徑與 Live Server。";
        }
    }

    function initMediaPipePose() {
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.3, minTrackingConfidence: 0.3 });
        
        pose.onResults((results) => {
            if (!videoElement.videoWidth) return;
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00e676', lineWidth: 2 });
            }
            canvasCtx.restore();
        });

        async function poseLoop() {
            if (videoElement.readyState >= 2 && !videoElement.paused) {
                try { await pose.send({ image: videoElement }); } catch (e) {}
            }
            requestAnimationFrame(poseLoop);
        }
        requestAnimationFrame(poseLoop);
    }

    // 🎯 YOLO 核心辨識邏輯
    async function scanDeviceLCDWithYOLO(video) {
        if (!yoloSession || !video || video.readyState < 2 || video.videoWidth === 0) return 0;
        
        const sw = video.videoWidth;
        const sh = video.videoHeight;

        // 1. 建立 640x640 畫布並截取綠框 ROI 範圍
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 640;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(video, sw * 0.15, sh * 0.20, sw * 0.70, sh * 0.55, 0, 0, 640, 640);
        const imgData = ctx.getImageData(0, 0, 640, 640);

        // 2. 轉換為 ONNX Tensor (1x3x640x640)
        const float32Data = new Float32Array(3 * 640 * 640);
        const data = imgData.data;
        for (let i = 0; i < 640 * 640; i++) {
            float32Data[i] = data[i * 4] / 255.0;
            float32Data[640 * 640 + i] = data[i * 4 + 1] / 255.0;
            float32Data[2 * 640 * 640 + i] = data[i * 4 + 2] / 255.0;
        }
        const tensor = new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);

        const feeds = {};
        feeds[yoloSession.inputNames[0]] = tensor;

        try {
            const results = await yoloSession.run(feeds);
            const output = results[yoloSession.outputNames[0]].data;

            // 3. 解析 YOLO 輸出並依 X 座標由左到右排序
            let detections = parseYoloDetections(output);
            detections.sort((a, b) => a.x - b.x);

            console.log("YOLO 偵測結果:", detections.map(d => `${d.cls}(x:${Math.round(d.x)})`).join(', '));

            let bestVal = 0;
            if (detections.length >= 2) {
                let digits = detections.map(d => d.cls);
                if (detections.length === 3) {
                    // [十位, 個位, 十分位] -> 例如 1, 3, 5 => 13.5
                    bestVal = (digits[0] * 10) + digits[1] + (digits[2] * 0.1);
                } else if (detections.length === 2) {
                    // [個位, 十分位] -> 例如 8, 2 => 8.2
                    bestVal = digits[0] + (digits[1] * 0.1);
                }
            }

            return (bestVal >= 0.5 && bestVal <= 60.0) ? Math.round(bestVal * 2) / 2 : 0;
        } catch (err) {
            console.error("YOLO 推論錯誤:", err);
            return 0;
        }
    }

    // 解析 YOLOv8 標準輸出張量 (格式 [8400, 14] 或類似)
    function parseYoloDetections(output) {
        let boxes = [];
        let numClasses = 10; // 0-9 共 10 個類別
        let numElements = 8400; // 典型 YOLOv8 anchor 數量
        
        // 假設 output 結構為 [1, 4 + numClasses, 8400]
        for (let i = 0; i < numElements; i++) {
            let maxClassScore = 0;
            let bestClassId = -1;

            for (let c = 0; c < numClasses; c++) {
                let score = output[(4 + c) * numElements + i];
                if (score > maxClassScore) {
                    maxClassScore = score;
                    bestClassId = c;
                }
            }

            // 信心水準門檻值
            if (maxClassScore > 0.55) {
                let x = output[0 * numElements + i];
                let y = output[1 * numElements + i];
                boxes.push({ cls: bestClassId, x: x, confidence: maxClassScore });
            }
        }

        // 非極大值抑制 (NMS) 簡單過濾重複框
        let filtered = [];
        boxes.sort((a, b) => b.confidence - a.confidence);
        for (let box of boxes) {
            let overlap = false;
            for (let f of filtered) {
                if (Math.abs(f.x - box.x) < 25 && f.cls === box.cls) {
                    overlap = true;
                    break;
                }
            }
            if (!overlap) filtered.push(box);
        }
        return filtered;
    }

    async function matchLoop() {
        if (!isProcessing && (state === 'WAITING_FOR_TARGET' || state === 'TESTING')) {
            const video = document.getElementById('webcam');
            if (video && video.readyState >= 2 && video.videoWidth > 0) {
                isProcessing = true;
                let val = await scanDeviceLCDWithYOLO(video);
                if (val > 0) {
                    latestOcrValue = val;
                    document.getElementById('current-grip-display').innerText = `${latestOcrValue} kg`;
                }
                isProcessing = false;
            }
        }
        setTimeout(matchLoop, 300);
    }

    function showStartButton(label) {
        const controlArea = document.getElementById('control-area');
        controlArea.innerHTML = `<button class="btn-primary" onclick="startCountdown()">${label}</button>`;
    }

    function startCountdown() {
        state = 'COUNTING_DOWN';
        document.getElementById('control-area').innerHTML = '';
        let count = 3;
        let handName = currentHand === 'right' ? '右手' : '左手';
        
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.3)';
        document.getElementById('status-bar').innerText = `🔥 ${handName}準備！倒數 ${count} 秒...`;
        speak(`${count}`);

        countdownTimer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('status-bar').innerText = `🔥 ${handName}準備！倒數 ${count} 秒...`;
                speak(`${count}`);
            } else {
                clearInterval(countdownTimer);
                beginGripMeasurement();
            }
        }, 1000);
    }

    function beginGripMeasurement() {
        state = 'TESTING';
        maxGripScore = 0.0;
        latestOcrValue = 0.0;
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        
        speak("請全力握緊！");
        document.getElementById('status-bar').style.backgroundColor = 'rgba(0, 230, 118, 0.2)';
        document.getElementById('status-bar').style.borderColor = '#00e676';
        document.getElementById('status-bar').style.color = '#00e676';
        document.getElementById('status-bar').innerText = "💪 測驗中 (5秒)：請持續用力緊握手握器...";

        let timeLeft = 5;
        testTimer = setInterval(() => {
            if (latestOcrValue > 0) {
                if (latestOcrValue > maxGripScore) {
                    maxGripScore = latestOcrValue;
                    document.getElementById('max-grip-display').innerText = `${maxGripScore} kg`;
                }
            }

            timeLeft--;
            if (timeLeft > 0) speak(`${timeLeft}`);

            if (timeLeft <= 0) {
                clearInterval(testTimer);
                
                if (maxGripScore <= 0) {
                    document.getElementById('status-bar').innerText = "⚠️ 未穩定讀取到數值，請調整擺放位置後重試！";
                    speak("未讀取到數值，請重試。");
                    state = 'WAITING_FOR_TARGET';
                    showStartButton(`🔄 重新測驗 ${currentHand === 'right' ? '右手' : '左手'} (第 ${currentAttempt} 次)`);
                    return;
                }

                if (currentHand === 'right') rightAttempts.push(maxGripScore);
                else leftAttempts.push(maxGripScore);

                speak(`成績，${maxGripScore} 公斤。`);
                handleAttemptCompletion();
            }
        }, 1000);
    }

    function handleAttemptCompletion() {
        let handName = currentHand === 'right' ? '右手' : '左手';
        
        if (currentAttempt < 3) {
            currentAttempt++;
            state = 'WAITING_FOR_TARGET';
            document.getElementById('status-bar').innerHTML = `🎉 【${handName}】第 ${currentAttempt - 1} 次成績：<b>${maxGripScore} kg</b>。準備好後請點擊下方按鈕進行下一次！`;
            document.getElementById('current-hand-label').innerText = `${handName} (第${currentAttempt}次)`;
            showStartButton(`▶️ 開始 ${handName}第 ${currentAttempt} 次測驗`);
        } else {
            if (currentHand === 'right') {
                currentHand = 'left';
                currentAttempt = 1;
                state = 'WAITING_FOR_TARGET';
                document.getElementById('current-hand-label').innerText = `左手 (第1次)`;
                document.getElementById('status-bar').innerHTML = `✅ 右手測驗全部完成！請換左手，準備好後點擊按鈕。`;
                speak("右手測驗完畢，請換左手進行測驗");
                showStartButton("🦾 開始左手第 1 次測驗");
            } else {
                showFinalUploadAndStop();
            }
        }
    }

    async function showFinalUploadAndStop() {
        state = 'FINISHED';
        let bestRight = rightAttempts.length > 0 ? Math.max(...rightAttempts) : 0;
        let bestLeft = leftAttempts.length > 0 ? Math.max(...leftAttempts) : 0;
        
        document.getElementById('status-bar').innerHTML = `📊 左右手全部完成！結算：右手 <b>${bestRight} kg</b> | 左手 <b>${bestLeft} kg</b><br>⏳ 正在上傳至雲端...`;
        speak("左右手測驗全部完成，正在上傳成績");
        
        try {
            await supabaseClient.from('fitness_records').insert([{ student_id: currentUserId, category: 'grip_right', score_value: bestRight, created_at: new Date() }]);
            await supabaseClient.from('fitness_records').insert([{ student_id: currentUserId, category: 'grip_left', score_value: bestLeft, created_at: new Date() }]);
            document.getElementById('status-bar').innerHTML = `✅ 成績已成功上傳至雲端！<br>📊 最佳成績：右手 <b>${bestRight} kg</b> | 左手 <b>${bestLeft} kg</b>`;
            speak("成績上傳成功");
            loadHistory();
        } catch (err) {
            document.getElementById('status-bar').innerText = "⚠️ 雲端上傳失敗，請檢查資料表連線";
        }

        const controlArea = document.getElementById('control-area');
        controlArea.innerHTML = `<button class="btn-secondary" onclick="fullReset()">🔄 重新開始全新測驗</button>`;
    }

    function fullReset() { 
        currentHand = 'right'; 
        currentAttempt = 1; 
        rightAttempts = []; 
        leftAttempts = []; 
        maxGripScore = 0.0;
        latestOcrValue = 0.0;
        document.getElementById('current-hand-label').innerText = `右手 (第1次)`;
        document.getElementById('current-grip-display').innerText = '0.0 kg';
        document.getElementById('max-grip-display').innerText = '0.0 kg';
        document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.15)';
        document.getElementById('status-bar').style.borderColor = '#ff9800';
        document.getElementById('status-bar').style.color = '#ff9800';
        document.getElementById('status-bar').innerText = `✅ 就緒！請將右手握力計放入綠框內。`;
        showStartButton("🚀 開始右手第 1 次測驗");
        state = 'WAITING_FOR_TARGET';
    }

    async function loadHistory() {
        const tbody = document.getElementById('history-tbody');
        try {
            const { data, error } = await supabaseClient.from('fitness_records').select('*').eq('student_id', currentUserId).in('category', ['grip_right', 'grip_left']).order('created_at', { ascending: false }).limit(10);
            tbody.innerHTML = '';
            if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="3">尚無記錄</td></tr>`; return; }
            data.forEach(row => {
                let handType = row.category === 'grip_right' ? '🔴 右手' : '🔵 左手';
                tbody.innerHTML += `<tr><td>${new Date(row.created_at).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${handType}</td><td><b style="color: #ff9800;">${row.score_value} kg</b></td></tr>`;
            });
        } catch (err) { tbody.innerHTML = `<tr><td colspan="3" style="color: red;">載入失敗</td></tr>`; }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => { 
        const utter = new SpeechSynthesisUtterance(text); 
        utter.lang = 'zh-HK'; 
        synth.cancel(); 
        synth.speak(utter); 
    };
</script>
</body>
</html>
