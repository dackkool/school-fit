<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 全自動智慧手握力測驗 | Grip Strength Challenge</title>
    <!-- Tesseract.js 用於智慧 OCR 辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Supabase JS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, 'Microsoft JhengHei', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-card { width: 100%; max-width: 500px; background-color: #1e1e1e; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 15px; }
        h1 { color: #ff9800; font-size: 1.3rem; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; text-align: center; }

        .tab-header { display: flex; border-bottom: 2px solid #333; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; font-size: 0.9rem; font-weight: bold; color: #777; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #ff9800; border-bottom: 3.5px solid #ff9800; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .user-info-banner { background: #2a2a2a; border: 1px solid #ff9800; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-info-banner span { color: #ff9800; font-weight: bold; }

        .camera-select-group { margin-bottom: 8px; }
        .camera-select-group label { font-size: 0.8rem; color: #4caf50; font-weight: bold; display: block; margin-bottom: 3px; }
        .camera-select-group select { width: 100%; padding: 6px; font-size: 0.9rem; border-radius: 8px; border: 1.5px solid #4caf50; background: #2a2a2a; color: white; }

        .video-wrapper { position: relative; width: 100%; height: 320px; border-radius: 12px; overflow: hidden; border: 2.5px solid #ff9800; background: #000; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 螢幕對準框 */
        .roi-guide-box {
            position: absolute;
            top: 25%;
            left: 15%;
            width: 70%;
            height: 45%;
            border: 3px dashed #00e676;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .roi-label { background: rgba(0,230,118,0.9); color: black; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 0 0 8px 8px; }

        .hud-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .hud-card { background: #2a2a2a; border-radius: 10px; padding: 8px; text-align: center; border: 1px solid #444; }
        .hud-title { font-size: 0.75rem; color: #aaa; }
        .hud-value { font-size: 1.4rem; font-weight: bold; color: #ff9800; margin-top: 2px; }

        #status-bar { background: rgba(255, 152, 0, 0.15); border: 1px solid #ff9800; color: #ff9800; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; }

        .history-container { background: #2a2a2a; border-radius: 10px; padding: 10px; max-height: 380px; overflow-y: auto; }
        table.history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.history-table th, table.history-table td { border: 1px solid #444; padding: 6px; text-align: center; }
        table.history-table th { background-color: #333; color: #ff9800; }
    </style>
</head>
<body>

<div id="main-card">
    <h1>AI 全自動手握力測驗</h1>
    <div class="subtitle">完全全自動・自動正反向辨識・OCR 智能讀取・雲端記錄</div>

    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('challenge')">🦾 全自動握力測驗</button>
        <button class="tab-btn" onclick="switchTab('history')">📋 歷史成績</button>
    </div>

    <!-- TAB 1: 測驗與辨識 -->
    <div id="tab-challenge" class="tab-content active">
        <div class="user-info-banner">
            <div>當前測驗學生：<span id="current-user-label">驗證中...</span></div>
            <button onclick="window.location.href='index.html'" style="background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">返回主頁</button>
        </div>

        <div class="camera-select-group">
            <label>選擇相機鏡頭：</label>
            <select id="camera-select" onchange="changeCamera()">
                <option value="">載入鏡頭列表中...</option>
            </select>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay muted playsinline></video>
            <!-- 螢幕對準框 -->
            <div class="roi-guide-box">
                <div class="roi-label">請將握力計螢幕置於此綠框內 (全自動偵測)</div>
            </div>
        </div>

        <div class="hud-panel">
            <div class="hud-card">
                <div class="hud-title">即時測得握力</div>
                <div class="hud-value" id="current-grip-display">0.0 kg</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">本輪最佳成績 (Peak)</div>
                <div class="hud-value" id="max-grip-display" style="color: #00e676;">0.0 kg</div>
            </div>
        </div>

        <div id="status-bar">⏳ 正在初始化 AI 光學辨識引擎...</div>
    </div>

    <!-- TAB 2: 歷史記錄 -->
    <div id="tab-history" class="tab-content" style="display: none;">
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: #aaa; font-weight: bold;">個人手握力歷史記錄：</span>
            <button onclick="loadHistory()" style="background: #333; color: #ff9800; border: 1px solid #ff9800; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">🔄 重新整理</button>
        </div>
        <div class="history-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>學號</th>
                        <th>姓名</th>
                        <th>最佳握力 (kg)</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr><td colspan="4" style="color: #777; padding: 15px;">載入記錄中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'supa url'; 
    const SUPABASE_ANON_KEY = 'anon key'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let currentUserName = '';
    let mediaStream = null;
    let isTesting = false;
    let maxGripScore = 0.0;
    let tesseractWorker = null;
    let autoDetectInterval = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        currentUserId = urlParams.get('user_id');

        if (!currentUserId) {
            alert('⚠️ 尚未登入！請先至登入頁面輸入學號。');
            window.location.href = 'index.html';
            return;
        }

        const isValidUser = await verifyAndFetchUser(currentUserId);
        if (!isValidUser) {
            alert('⚠️ 無效的學號或使用者不存在，請重新登入！');
            window.location.href = 'index.html';
            return;
        }

        await initCameraDevices();
        await startWebcam();
        await initTesseractOCR();
        loadHistory();
    });

    async function verifyAndFetchUser(userId) {
        try {
            const { data, error } = await supabaseClient
                .from('students_db')
                .select('student_id, name')
                .eq('student_id', userId)
                .single();

            if (error || !data) return false;
            currentUserName = data.name;
            document.getElementById('current-user-label').innerText = `${currentUserName} (${currentUserId})`;
            return true;
        } catch (e) {
            console.error("驗證使用者失敗", e);
            return false;
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => { c.classList.remove('active'); c.style.display = 'none'; });

        const tabs = { 'challenge': 0, 'history': 1 };
        document.querySelectorAll('.tab-btn')[tabs[tabName]].classList.add('active');
        const target = document.getElementById(`tab-${tabName}`);
        target.classList.add('active');
        target.style.display = 'flex';

        if (tabName === 'history') loadHistory();
    }

    async function initCameraDevices() {
        const cameraSelect = document.getElementById('camera-select');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const opt = document.createElement('option');
                opt.value = device.deviceId;
                opt.text = device.label || `鏡頭 ${index + 1}`;
                cameraSelect.appendChild(opt);
            });
        } catch (e) {
            console.error("無法取得鏡頭列表", e);
        }
    }

    async function startWebcam(deviceId = null) {
        const videoElement = document.getElementById('webcam');
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        };

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = mediaStream;
            await videoElement.play();
            console.log("相機串流順暢執行中");
        } catch (err) {
            console.error("相機啟動失敗:", err);
            document.getElementById('status-bar').innerText = "⚠️ 無法存取相機權限，請檢查瀏覽器設定！";
        }
    }

    async function changeCamera() {
        const selectedId = document.getElementById('camera-select').value;
        await startWebcam(selectedId);
    }

    async function initTesseractOCR() {
        try {
            document.getElementById('status-bar').innerText = "⏳ 正在初始化 AI 光學辨識引擎 (OCR)...";
            tesseractWorker = await Tesseract.createWorker('eng');
            await tesseractWorker.setParameters({
                tessedit_char_whitelist: '0123456789.',
            });
            document.getElementById('status-bar').innerText = "✅ 全自動就緒！請將握力計螢幕置於綠色框內，系統會自動偵測數值並測驗。";
            
            // 啟動全自動背景偵測迴圈 (每 700ms 掃描一次畫面)
            autoDetectInterval = setInterval(autoDetectAndRunTest, 700);
        } catch (e) {
            console.error("Tesseract 初始化失敗", e);
            document.getElementById('status-bar').innerText = "⚠️ OCR 載入失敗。";
        }
    }

    // 智能 OCR 辨識核心 (支援 0度 與 180度自動反轉)
    async function recognizeLCDNumber(video) {
        if (!tesseractWorker) return 0;
        const sw = video.videoWidth || 640;
        const sh = video.videoHeight || 480;
        
        // 抓取綠色對準框範圍
        const sx = sw * 0.15;
        const sy = sh * 0.25;
        const sWidth = sw * 0.7;
        const sHeight = sh * 0.45;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = sWidth;
        tempCanvas.height = sHeight;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

        try {
            const values = [];
            // 1. 正向 0 度
            const { data: { text: text0 } } = await tesseractWorker.recognize(tempCanvas);
            let val0 = parseFloat(text0.replace(/[^0-9.]/g, ''));
            if (!isNaN(val0) && val0 > 0 && val0 < 150) values.push(val0);

            // 2. 倒轉 180 度 (支援握力計倒拿)
            const rotatedCanvas = document.createElement('canvas');
            rotatedCanvas.width = sWidth;
            rotatedCanvas.height = sHeight;
            const rctx = rotatedCanvas.getContext('2d');
            rctx.translate(sWidth, sHeight);
            rctx.rotate(Math.PI);
            rctx.drawImage(tempCanvas, 0, 0);

            const { data: { text: text180 } } = await tesseractWorker.recognize(rotatedCanvas);
            let val180 = parseFloat(text180.replace(/[^0-9.]/g, ''));
            if (!isNaN(val180) && val180 > 0 && val180 < 150) values.push(val180);

            return values.length > 0 ? Math.max(...values) : 0;
        } catch (err) {
            return 0;
        }
    }

    // 全自動偵測：當畫面中偵測到大於 0.5kg 的數值時，自動啟動 5 秒計時測驗！
    async function autoDetectAndRunTest() {
        if (isTesting || !tesseractWorker) return;
        const video = document.getElementById('webcam');
        if (!video || video.paused || video.ended || video.readyState < 2) return;

        let detectedVal = await recognizeLCDNumber(video);
        if (detectedVal > 0.5) {
            // 觸發全自動測驗！
            triggerAutomaticGripTest(detectedVal);
        }
    }

    function triggerAutomaticGripTest(initialVal) {
        isTesting = true;
        maxGripScore = initialVal;
        document.getElementById('current-grip-display').innerText = `${initialVal} kg`;
        document.getElementById('max-grip-display').innerText = `${maxGripScore} kg`;

        speak("偵測到握力，自動測驗開始！");
        document.getElementById('status-bar').style.backgroundColor = 'rgba(0, 230, 118, 0.2)';
        document.getElementById('status-bar').style.borderColor = '#00e676';
        document.getElementById('status-bar').style.color = '#00e676';

        let timeLeft = 5;
        let testTimer = setInterval(async () => {
            // 在 5 秒測驗期間持續抓取畫面中的最大峰值
            const video = document.getElementById('webcam');
            if (video && video.readyState >= 2) {
                let currentVal = await recognizeLCDNumber(video);
                if (currentVal > 0) {
                    document.getElementById('current-grip-display').innerText = `${currentVal} kg`;
                    if (currentVal > maxGripScore) {
                        maxGripScore = currentVal;
                        document.getElementById('max-grip-display').innerText = `${maxGripScore} kg`;
                    }
                }
            }

            timeLeft--;
            if (timeLeft > 0) {
                speak(`${timeLeft}`);
            }

            if (timeLeft <= 0) {
                clearInterval(testTimer);
                
                document.getElementById('status-bar').innerText = `🎉 測驗完成！本輪最佳握力：${maxGripScore} kg，已自動上傳雲端！`;
                speak(`測驗完成，最佳成績 ${maxGripScore} 公斤。`);
                
                await uploadResult(currentUserId, maxGripScore);

                // 休息 3 秒後恢復全自動待命狀態
                setTimeout(() => {
                    isTesting = false;
                    maxGripScore = 0.0;
                    document.getElementById('current-grip-display').innerText = '0.0 kg';
                    document.getElementById('max-grip-display').innerText = '0.0 kg';
                    document.getElementById('status-bar').style.backgroundColor = 'rgba(255, 152, 0, 0.15)';
                    document.getElementById('status-bar').style.borderColor = '#ff9800';
                    document.getElementById('status-bar').style.color = '#ff9800';
                    document.getElementById('status-bar').innerText = "✅ 準備就緒！請將握力計螢幕置於綠色框內，隨時可進行下一次測驗。";
                }, 3000);
            }
        }, 1000);
    }

    async function uploadResult(studentId, score) {
        try {
            const { error } = await supabaseClient.from('fitness_records').insert([
                { 
                    student_id: studentId, 
                    category: 'grip_strength', 
                    score_value: score, 
                    created_at: new Date() 
                }
            ]);
            if (error) throw error;
            console.log("握力成績上傳成功");
            loadHistory();
        } catch (err) {
            console.error("成績上傳失敗", err);
            alert("成績上傳雲端失敗，請確認 Supabase 是否已正確建立 fitness_records 表格！");
        }
    }

    async function loadHistory() {
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = `<tr><td colspan="4" style="color: #ff9800; padding: 15px;">載入記錄中...</td></tr>`;

        try {
            const { data, error } = await supabaseClient
                .from('fitness_records')
                .select('*')
                .eq('student_id', currentUserId)
                .eq('category', 'grip_strength')
                .order('created_at', { ascending: false })
                .limit(30);

            if (error) throw error;

            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #777; padding: 15px;">尚無個人測驗記錄</td></tr>`;
                return;
            }

            data.forEach(row => {
                const dateStr = new Date(row.created_at).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                tbody.innerHTML += `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${row.student_id}</td>
                        <td>${currentUserName}</td>
                        <td><b style="color: #ff9800;">${row.score_value} kg</b></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("載入歷史記錄失敗:", err);
            tbody.innerHTML = `<tr><td colspan="4" style="color: #f44336; padding: 15px;">載入出錯：請確認 Supabase 已建立 <b>fitness_records</b> 表。</td></tr>`;
        }
    }

    const synth = window.speechSynthesis;
    const speak = (text) => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        synth.cancel();
        synth.speak(utter);
    };
</script>

</body>
</html>
