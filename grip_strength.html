<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>AI 智能握力挑戰 - 精準對位 Dict 匹配版</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center min-h-screen p-4">

    <header class="w-full max-w-2xl flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">💪 AI 智能握力挑戰 (精準對位 Dict 匹配)</h1>
        <div class="space-x-2">
            <button onclick="switchTab('game')" id="btn-game" class="px-4 py-2 bg-green-600 rounded font-bold">挑戰模式</button>
            <button onclick="switchTab('history')" id="btn-history" class="px-4 py-2 bg-gray-700 rounded">歷史往績</button>
        </div>
    </header>

    <main id="view-game" class="w-full max-w-2xl flex flex-col items-center">
        <div class="relative inline-block border-4 border-green-500 rounded-lg overflow-hidden shadow-lg mb-4 bg-black">
            <video id="webcam" autoplay playsinline width="640" height="480" class="block"></video>
            <!-- 實體白框指引 -->
            <div class="absolute border-2 border-dashed border-yellow-400 pointer-events-none" 
                 style="top: 30%; left: 25%; width: 50%; height: 35%;">
                <span class="text-xs bg-black/60 px-2 py-1 text-yellow-400 rounded">請將實體白框對準此區域</span>
            </div>
        </div>

        <!-- 顯示當前辨識結果 -->
        <div class="text-4xl font-mono text-green-400 mb-2 cursor-pointer hover:underline" title="點擊可手動修改數值">
            當前讀數: <span id="grip-result">0.0</span> kg
        </div>
        <p class="text-xs text-gray-400 mb-4" id="status-tip">(狀態: 載入 dict 模板中...)</p>

        <!-- 操作按鈕 -->
        <div class="space-x-4">
            <button onclick="recordGripScore()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-xl font-bold shadow-lg">
                紀錄本次成績並上傳雲端
            </button>
        </div>
    </main>

    <main id="view-history" class="w-full max-w-2xl hidden">
        <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">📈 過往挑戰紀錄 (Supabase)</h2>
        <div class="bg-gray-800 rounded-lg p-4 shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="py-2">時間</th>
                        <th class="py-2">握力成績 (kg)</th>
                        <th class="py-2">狀態</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="3" class="py-4 text-center text-gray-500">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <canvas id="processing-canvas" style="display:none;"></canvas>

    <script>
        const SUPABASE_URL = '你的_SUPABASE_URL';
        const SUPABASE_KEY = '你的_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tab) {
            if (tab === 'game') {
                document.getElementById('view-game').classList.remove('hidden');
                document.getElementById('view-history').classList.add('hidden');
                document.getElementById('btn-game').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-history').className = 'px-4 py-2 bg-gray-700 rounded';
            } else {
                document.getElementById('view-game').classList.add('hidden');
                document.getElementById('view-history').classList.remove('hidden');
                document.getElementById('btn-history').className = 'px-4 py-2 bg-green-600 rounded font-bold';
                document.getElementById('btn-game').className = 'px-4 py-2 bg-gray-700 rounded';
                loadHistoryFromSupabase();
            }
        }

        const video = document.getElementById('webcam');
        const resultSpan = document.getElementById('grip-result');
        const statusTip = document.getElementById('status-tip');
        const canvas = document.getElementById('processing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const T_W = 30;
        const T_H = 50;
        const templates = {};
        let dictReady = false;

        // 1. 載入 dict/0.png ~ 9.png
        async function loadDict() {
            let loaded = 0;
            const tempC = document.createElement('canvas');
            tempC.width = T_W;
            tempC.height = T_H;
            const tCtx = tempC.getContext('2d', { willReadFrequently: true });

            for (let i = 0; i <= 9; i++) {
                await new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = `dict/${i}.png`;
                    img.onload = () => {
                        tCtx.clearRect(0, 0, T_W, T_H);
                        tCtx.drawImage(img, 0, 0, T_W, T_H);
                        const imgData = tCtx.getImageData(0, 0, T_W, T_H);
                        const gray = new Uint8Array(T_W * T_H);
                        for (let p = 0; p < imgData.data.length; p += 4) {
                            gray[p / 4] = (imgData.data[p] + imgData.data[p+1] + imgData.data[p+2]) / 3;
                        }
                        templates[i] = gray;
                        loaded++;
                        resolve();
                    };
                    img.onerror = () => {
                        console.error(`無法載入 dict/${i}.png`);
                        resolve();
                    };
                });
            }
            if (loaded === 10) {
                dictReady = true;
                statusTip.innerText = "(狀態: dict 模板 0-9 已完全載入，精準匹配中)";
            } else {
                statusTip.innerText = `(警告: 僅載入 ${loaded}/10 張 dict 圖片)`;
            }
        }
        loadDict();

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: 'environment' } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => { video.onloadedmetadata = () => resolve(video); });
            } catch (err) {
                console.error("相機啟動失敗:", err);
            }
        }

        let currentDetectedValue = 0.0;
        let manualOverride = false;

        resultSpan.parentElement.onclick = () => {
            let val = prompt("請輸入或確認當前握力成績 (kg):", currentDetectedValue.toFixed(1));
            if (val !== null && !isNaN(val)) {
                currentDetectedValue = parseFloat(val);
                manualOverride = true;
                resultSpan.innerText = currentDetectedValue.toFixed(1);
            }
        };

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && !manualOverride && dictReady) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;

                canvas.width = vw;
                canvas.height = vh;
                ctx.drawImage(video, 0, 0, vw, vh);

                // 定位白框 ROI 區域
                const roiX = vw * 0.25;
                const roiY = vh * 0.30;
                const roiW = vw * 0.50;
                const roiH = vh * 0.35;

                const roiImgData = ctx.getImageData(roiX, roiY, roiW, roiH);
                
                // 執行精準比對
                currentDetectedValue = matchLCD(roiImgData);
                resultSpan.innerText = currentDetectedValue.toFixed(1);
            }
            requestAnimationFrame(processFrame);
        }

        // 真正的 LCD 辨識核心：比對整數與小數
        function matchLCD(roiImgData) {
            // 透過整體驗光明暗防呆：若螢幕整體偏暗或處於歸零，直接回傳 0.0
            let data = roiImgData.data;
            let brightCount = 0;
            for (let i = 0; i < data.length; i += 16) {
                if ((data[i] + data[i+1] + data[i+2]) / 3 > 140) brightCount++;
            }

            // 如果發光點符合 0.0 的總量特徵，直接回傳 0.0
            if (brightCount > 1000 && brightCount < 3000) {
                // 進一步用 dict 辨識左側與右側數字
                let tens = recognizeDigit(roiImgData, 0.20, 0.15, 0.20, 0.7);
                let ones = recognizeDigit(roiImgData, 0.42, 0.15, 0.20, 0.7);
                let decimals = recognizeDigit(roiImgData, 0.70, 0.15, 0.20, 0.7);

                // 如果辨識出來是 0 和 0，就穩穩回傳 0.0
                if (tens === 0 && ones === 0) return 0.0;
                return parseFloat(`${tens}${ones}.${decimals}`);
            }

            // 當用力時，利用 dict 分別對應十位、個位、小數
            let t = recognizeDigit(roiImgData, 0.20, 0.15, 0.20, 0.7);
            let o = recognizeDigit(roiImgData, 0.42, 0.15, 0.20, 0.7);
            let d = recognizeDigit(roiImgData, 0.70, 0.15, 0.20, 0.7);

            let val = parseFloat(`${t}${o}.${d}`);
            if (isNaN(val) || val > 99.9) return 0.0;
            return val;
        }

        // SAD 樣板匹配單個字元
        function recognizeDigit(roiImgData, rx, ry, rw, rh) {
            const rW = roiImgData.width;
            const rH = roiImgData.height;
            const startX = Math.floor(rW * rx);
            const startY = Math.floor(rH * ry);
            const w = Math.floor(rW * rw);
            const h = Math.floor(rH * rh);

            const subC = document.createElement('canvas');
            subC.width = T_W;
            subC.height = T_H;
            const sCtx = subC.getContext('2d', { willReadFrequently: true });

            sCtx.drawImage(canvas, (rW * 0.25) + startX, (rH * 0.30) + startY, w, h, 0, 0, T_W, T_H);
            const subData = sCtx.getImageData(0, 0, T_W, T_H);
            const targetGray = new Uint8Array(T_W * T_H);
            for (let i = 0; i < subData.data.length; i += 4) {
                targetGray[i / 4] = (subData.data[i] + subData.data[i+1] + subData.data[i+2]) / 3;
            }

            let bestDigit = 0;
            let minDiff = Infinity;

            for (let digit = 0; digit <= 9; digit++) {
                const templ = templates[digit];
                if (!templ) continue;

                let diff = 0;
                for (let p = 0; p < targetGray.length; p++) {
                    diff += Math.abs(targetGray[p] - templ[p]);
                }

                if (diff < minDiff) {
                    minDiff = diff;
                    bestDigit = digit;
                }
            }
            return bestDigit;
        }

        async function recordGripScore() {
            const score = currentDetectedValue;
            const { data, error } = await supabaseClient
                .from('grip_records')
                .insert([{ score: score, created_at: new Date() }]);

            if (error) {
                alert('成績上傳雲端失敗');
            } else {
                alert(`🎉 成功上傳成績: ${score} kg 到雲端！`);
                speakResult(score);
                manualOverride = false;
            }
        }

        async function loadHistoryFromSupabase() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">正在讀取往績...</td></tr>`;
            const { data, error } = await supabaseClient
                .from('grip_records')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(10);

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">尚無挑戰紀錄</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(row => {
                const dateStr = new Date(row.created_at).toLocaleString();
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700/50">
                        <td class="py-3 text-gray-300">${dateStr}</td>
                        <td class="py-3 font-bold text-green-400">${row.score} kg</td>
                        <td class="py-3 text-yellow-400">已同步</td>
                    </tr>
                `;
            });
        }

        function speakResult(score) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(`本次握力成績為 ${score} 公斤`);
                utterance.lang = 'zh-HK';
                window.speechSynthesis.speak(utterance);
            }
        }

        setupCamera().then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
